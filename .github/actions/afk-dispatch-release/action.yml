name: AFK dispatch release
description: Release an AFK command's target after its job failed, and replace the App's 👀 on the command with 😕

inputs:
  number:
    description: The number of the issue or pull request that the command was posted on
    required: true
  comment-id:
    description: The id of the command's comment
    required: true
  accepted:
    description: The afk-dispatch action's accepted output
    required: false
    default: ""
  app-token:
    description: The AFK App's token with Issues and Pull requests write, for the label and the reactions
    required: true
  bot-id:
    description: The account id of the AFK App's bot, whose 👀 on the command the 😕 replaces
    required: true
  dry-run:
    description: Report the writes in the effects output instead of making them
    required: false
    default: "false"

outputs:
  effects:
    description: The planned writes as a JSON array, set only in a dry run
    value: ${{ steps.release.outputs.effects }}

runs:
  using: composite
  steps:
    - name: Set up afk
      id: afk
      uses: $/.github/actions/setup-afk

    - name: Release the target and react confused instead of 👀
      id: release
      shell: bash
      env:
        AFK_PYTHON: ${{ steps.afk.outputs.python }}
        AFK_NUMBER: ${{ inputs.number }}
        AFK_COMMENT_ID: ${{ inputs.comment-id }}
        AFK_ACCEPTED: ${{ inputs.accepted }}
        AFK_APP_TOKEN: ${{ inputs.app-token }}
        AFK_BOT_ID: ${{ inputs.bot-id }}
        AFK_DRY_RUN: ${{ inputs.dry-run }}
        GH_REPO: ${{ github.repository }}
      run: |
        "$AFK_PYTHON" -m afk dispatch-release
