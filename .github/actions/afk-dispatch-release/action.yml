name: AFK dispatch release
description: Release an AFK command's target after its job failed, and react confused to the command

inputs:
  number:
    description: The number of the issue or pull request that the command was posted on
    required: true
  comment-id:
    description: The id of the command's comment
    required: true
  accepted:
    description: The afk-dispatch action's accepted output
    required: false
    default: ""
  app-token:
    description: The AFK App's token with Issues and Pull requests write, for the label and the reaction
    required: true
  dry-run:
    description: Report the writes in the effects output instead of making them
    required: false
    default: "false"

outputs:
  effects:
    description: The planned writes as a JSON array, set only in a dry run
    value: ${{ steps.release.outputs.effects }}

runs:
  using: composite
  steps:
    # The Python that the package's checks and tests run on.
    - name: Set up Python
      id: python
      uses: actions/setup-python@v7.1.0
      with:
        python-version: "3.11"
        # Leaves the caller's PATH and environment as they were; the next step uses python-path.
        update-environment: false

    # Needs $/ to fetch the whole repository at the workflow's commit, so that the package sits beside the action.
    - name: Install the afk package and its pinned runtime requirements
      shell: bash
      env:
        PYTHON: ${{ steps.python.outputs.python-path }}
      run: |
        "$PYTHON" -m venv "$RUNNER_TEMP/afk-venv"
        "$RUNNER_TEMP/afk-venv/bin/pip" install --disable-pip-version-check --quiet \
          --requirement "$GITHUB_ACTION_PATH/../../../tools/afk/requirements/base.txt" \
          "$GITHUB_ACTION_PATH/../../../tools/afk"

    - name: Release the target and react confused
      id: release
      shell: bash
      env:
        AFK_NUMBER: ${{ inputs.number }}
        AFK_COMMENT_ID: ${{ inputs.comment-id }}
        AFK_ACCEPTED: ${{ inputs.accepted }}
        AFK_APP_TOKEN: ${{ inputs.app-token }}
        AFK_DRY_RUN: ${{ inputs.dry-run }}
        GH_REPO: ${{ github.repository }}
      run: |
        "$RUNNER_TEMP/afk-venv/bin/python" -m afk dispatch-release
