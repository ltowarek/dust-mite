name: Auto-merge Dependabot PRs

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'ltowarek/dust-mite'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0

      # The main ruleset's required ci-status checks gate the merge, so a bump
      # that breaks the build or the QEMU tests stays open.
      - name: Enable auto-merge
        if: contains(fromJSON('["docker", "npm"]'), steps.metadata.outputs.package-ecosystem)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
