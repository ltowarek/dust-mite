name: AFK run
run-name: 'afk implement #${{ inputs.number }}'

on:
  workflow_dispatch:
    inputs:
      number:
        description: The ticket or spec
        required: true
        type: number
      comment-id:
        description: The AFK command's comment; empty when started from the Actions tab
        required: false
        type: string

permissions: {}

concurrency:
  group: afk-run
  queue: max

env:
  TICKET: ${{ inputs.number }}
  COMMENT_ID: ${{ inputs.comment-id }}
  GH_REPO: ${{ github.repository }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  ALREADY_COVERED_LINES: '.already_covered // [] | .[] | "- \(.problem | gsub("\\s*\\n\\s*"; " ")) Covered by #\(.covered_by)."'

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      issues: read
      pull-requests: read

    outputs:
      url: ${{ steps.check.outputs.url }}
      spec: ${{ steps.check.outputs.spec }}
      child-ticket: ${{ steps.check.outputs.child-ticket }}
      child-ticket-url: ${{ steps.check.outputs.child-ticket-url }}
      branch: ${{ steps.check.outputs.branch }}
      last-run: ${{ steps.check.outputs.last-run }}
      refusal: ${{ steps.check.outputs.refusal }}
      block: ${{ steps.check.outputs.block }}
      queue: ${{ steps.check.outputs.queue }}

    steps:
      - name: Mint the App's write token for the label
        id: write-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.AFK_APP_CLIENT_ID }}
          private-key: ${{ secrets.AFK_APP_PRIVATE_KEY }}
          permission-issues: write

      - name: Mark the ticket in progress, and decide whether its run goes ahead
        id: check
        uses: $/.github/actions/afk-run-check
        with:
          number: ${{ inputs.number }}
          app-token: ${{ steps.write-token.outputs.token }}
          workflow-token: ${{ github.token }}

  implement:
    needs: check
    if: needs.check.outputs.refusal == '' && needs.check.outputs.queue != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    permissions:
      contents: read

    env:
      WORKED_TICKET: ${{ needs.check.outputs.child-ticket || inputs.number }}
      BRANCH: ${{ needs.check.outputs.branch }}

    outputs:
      agent-error: ${{ steps.publish.outputs.agent-error }}
      agent-output: ${{ steps.agent.outputs.structured_output }}
      outcome: ${{ steps.publish.outputs.outcome }}
      needs-car-reason: ${{ steps.publish.outputs.needs-car-reason }}
      pr-url: ${{ steps.publish.outputs.pr-url }}
      sha: ${{ steps.publish.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The commit the agent starts from; publish refuses its later commits that change .github/ or tools/.
      - name: Switch to the branch
        id: branch
        run: |
          git switch "$BRANCH" || git switch -c "$BRANCH"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Write .env
        run: ./scripts/dump_env.sh

      - name: Read the agent's output schema
        id: schema
        # The workflow's own commit, not the checkout.
        run: |
          schema=$(git show "${GITHUB_SHA}:.github/afk-run-output.schema.json")
          json=$(jq -c . <<<"$schema")
          echo "json=$json" >> "$GITHUB_OUTPUT"

      - name: Mint the App's read-only token for the agent
        id: read-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.AFK_APP_CLIENT_ID }}
          private-key: ${{ secrets.AFK_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - name: Run the AFK agent session
        id: agent
        uses: anthropics/claude-code-action@v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.read-token.outputs.token }}
          bot_name: ${{ vars.AFK_APP_SLUG }}[bot]
          bot_id: ${{ vars.AFK_APP_BOT_ID }}
          allowed_bots: ${{ vars.AFK_APP_SLUG }}
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: mattpocock-skills@claude-plugins-official
          prompt: |
            /mattpocock-skills:implement ${{ needs.check.outputs.child-ticket-url || needs.check.outputs.url }}
            Every step `implement` names is mandatory in an AFK agent session; never skip one because the change is small.

            This is an AFK agent session: no one will answer questions. Follow CLAUDE.md, including running every check inside the devcontainer it names; Docker is available.
            Commit to the current branch. Do not push, open or edit pull requests, file tickets, comment, or change labels.
            Follow docs/agents/follow-up-tickets.md: list follow-up tickets in follow_ups and follow-ups already covered in already_covered.
            At a spec gap, follow docs/agents/spec-gaps.md: make no commits, set outcome to spec_gap, and write the comment in spec_gaps.
            If finding the fix needs the car (flashing it, or watching how it behaves), make no commits, set outcome to needs_car, set car_variant to the variant on which the ticket's code runs, and explain why in needs_car_reason.
            Otherwise set outcome to done, write a Conventional Commits PR title in pr_title, and write the PR body with the pr skill in pr_body.
            Set needs_dut_run to whether your change can only be confirmed by a DUT run on the car, judged from the change itself; if it can, set car_variant.
            ${{ needs.check.outputs.spec == 'true' && format('This ticket is a child ticket of the spec #{0}, and the current branch already holds the commits of its earlier child tickets. Review only your own commits, but write pr_title and pr_body and judge needs_dut_run for the branch''s whole change against main.', inputs.number) || '' }}
          claude_args: >-
            --model claude-opus-5-5 --effort medium
            --allowedTools Bash,Read,Edit,Write,Glob,Grep,Skill,Task,TodoWrite
            --json-schema '${{ steps.schema.outputs.json }}'

      - name: Mint the App's write token for the push, PR, labels and comments
        id: write-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.AFK_APP_CLIENT_ID }}
          private-key: ${{ secrets.AFK_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      # Also after a failed agent, so that the action sets the agent's error for finish.
      - name: Publish the agent's work, or hand the ticket on
        id: publish
        if: '!cancelled()'
        uses: $/.github/actions/afk-run-publish
        with:
          ticket: ${{ inputs.number }}
          worked-ticket: ${{ env.WORKED_TICKET }}
          branch: ${{ env.BRANCH }}
          last-run: ${{ needs.check.outputs.last-run }}
          base: ${{ steps.branch.outputs.base }}
          agent-outcome: ${{ steps.agent.outcome }}
          agent-output: ${{ steps.agent.outputs.structured_output }}
          execution-file: ${{ steps.agent.outputs.execution_file }}
          app-token: ${{ steps.write-token.outputs.token }}

  finish:
    needs: [check, implement]
    if: always()
    runs-on: ubuntu-latest

    permissions:
      actions: write

    env:
      WORKED_TICKET: ${{ needs.check.outputs.child-ticket || inputs.number }}

    steps:
      - name: Mint the App's write token for tickets, labels and comments
        id: write-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.AFK_APP_CLIENT_ID }}
          private-key: ${{ secrets.AFK_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      - name: Refuse the ticket
        if: always() && needs.check.outputs.refusal != ''
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
          REFUSAL: ${{ needs.check.outputs.refusal }}
          BLOCK: ${{ needs.check.outputs.block }}
        run: |
          if [ "$BLOCK" = true ]; then
            gh issue edit "$TICKET" --add-label afk:blocked
          fi
          gh issue comment "$TICKET" --body "$REFUSAL"

      - name: File the follow-up tickets
        if: always() && needs.implement.outputs.agent-output != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
          OUTPUT: ${{ needs.implement.outputs.agent-output }}
        run: |
          jq -c '.follow_ups // [] | .[]' <<<"$OUTPUT" | while IFS= read -r follow_up; do
            title=$(jq -r .title <<<"$follow_up")
            labels=$(jq -r '[.type] + .components | join(",")' <<<"$follow_up")
            {
              printf '> *Follow-up ticket filed by an AFK agent session while working #%s.* ([run](%s))\n\n' "$WORKED_TICKET" "$RUN_URL"
              jq -r .body <<<"$follow_up"
            } > "$RUNNER_TEMP/follow-up.md"
            gh issue create \
              --title "$title" \
              --body-file "$RUNNER_TEMP/follow-up.md" \
              --label needs-triage,source:follow-up \
              --label "$labels"
          done

      - name: Comment the follow-ups already covered
        if: always() && needs.implement.outputs.pr-url != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
          OUTPUT: ${{ needs.implement.outputs.agent-output }}
          PR_URL: ${{ needs.implement.outputs.pr-url }}
        run: |
          already_covered=$(jq -r "$ALREADY_COVERED_LINES" <<<"$OUTPUT")
          if [ -n "$already_covered" ]; then
            printf '## Follow-ups already covered\n\n%s\n' "$already_covered" | gh pr comment "$PR_URL" --body-file -
          fi

      - name: Close the spec's child ticket
        if: always() && needs.check.outputs.spec == 'true' && needs.implement.outputs.sha != ''
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
          SHA: ${{ needs.implement.outputs.sha }}
        run: gh issue close "$WORKED_TICKET" --comment "Implemented in ${SHA}"

      - name: Clear afk:blocked after a successful run
        if: always() && needs.implement.result == 'success'
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
        run: gh issue edit "$TICKET" --remove-label afk:blocked

      - name: Stop the spec's implementation at a spec gap or a needs-car stop
        if: always() && needs.check.outputs.spec == 'true' && needs.implement.result == 'success' && needs.implement.outputs.sha == ''
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
          OUTCOME: ${{ needs.implement.outputs.outcome }}
          NEEDS_CAR_REASON: ${{ needs.implement.outputs.needs-car-reason }}
        run: |
          if [ "$OUTCOME" = needs_car ]; then
            reason="Finding the fix needs the car: ${NEEDS_CAR_REASON}"
          else
            reason="It has a spec gap, whose questions are on it."
          fi
          cat > "$RUNNER_TEMP/implementation-stop.md" <<EOF
          AFK spec implementation stopped at child ticket #${WORKED_TICKET}.

          **Reason:** ${reason}

          **Run:** ${RUN_URL}

          Comment \`/afk implement\` to resume it.
          EOF
          gh issue edit "$TICKET" --add-label afk:blocked
          gh issue comment "$TICKET" --body-file "$RUNNER_TEMP/implementation-stop.md"

      - name: Report the failure
        if: always() && (failure() || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
          ACTIONS_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          AGENT_ERROR: ${{ needs.implement.outputs.agent-error }}
          SPEC: ${{ needs.check.outputs.spec }}
        run: |
          failed_step=$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs" \
            --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or any(.steps[]?; .conclusion == "failure"))
              | [.name, first(.steps[]? | select(.conclusion == "failure" or .conclusion == "cancelled") | .name)] | join(" › ")]
              | first // "unknown step"')
          reason="\`${failed_step}\` failed."
          if [ -n "$AGENT_ERROR" ]; then
            reason="${reason} The agent reported: ${AGENT_ERROR}"
          fi
          failed="The AFK run failed"
          if [ "$SPEC" = true ]; then
            failed="The AFK run failed on child ticket #${WORKED_TICKET}"
          fi
          cat > "$RUNNER_TEMP/failure.md" <<EOF
          ${failed}.

          **Reason:** ${reason}

          **Run:** ${RUN_URL}

          Comment \`/afk implement\` to retry.
          EOF
          gh issue edit "$TICKET" --add-label afk:blocked
          gh issue comment "$TICKET" --body-file "$RUNNER_TEMP/failure.md"

      # The marker carries the AFK command to the run that afk-promote-queued.yml dispatches.
      - name: Queue the spec until a child ticket is unblocked
        id: queue
        if: needs.check.outputs.queue == 'true'
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
        run: |
          gh issue edit "$TICKET" --add-label afk:queued
          gh issue comment "$TICKET" --body "Queued (\`afk:queued\`) until one of its child tickets is unblocked. <!-- afk-command: ${COMMENT_ID} -->"

      # The spec keeps afk:in-progress, and the command its reaction, until its implementation ends.
      - name: Dispatch the spec's next run
        id: next
        if: needs.check.outputs.spec == 'true' && needs.implement.outputs.sha != '' && needs.check.outputs.last-run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          inputs=(-f number="$TICKET")
          if [ -n "$COMMENT_ID" ]; then
            inputs+=(-f comment-id="$COMMENT_ID")
          fi
          gh workflow run afk-run.yml --ref "$GITHUB_REF_NAME" "${inputs[@]}"

      - name: Clear afk:in-progress
        if: always() && steps.next.outcome != 'success'
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
        run: gh issue edit "$TICKET" --remove-label afk:in-progress

      - name: React to the AFK command
        if: always() && inputs.comment-id != '' && steps.next.outcome != 'success' && steps.queue.outcome != 'success'
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
          SUCCEEDED: ${{ needs.check.outputs.refusal == '' && needs.implement.result == 'success' && needs.implement.outputs.outcome == 'done' && job.status == 'success' }}
        run: |
          content=confused
          if [ "$SUCCEEDED" = true ]; then
            content=rocket
          fi
          gh api --method POST "repos/${GH_REPO}/issues/comments/${COMMENT_ID}/reactions" -f content="$content"
