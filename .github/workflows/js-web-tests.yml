name: JavaScript web tests

on:
  workflow_call:
    inputs:
      image:
        description: The JavaScript devcontainer image, referenced by digest
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:
        required: true

jobs:
  tests:
    permissions:
      contents: read

    runs-on: ubuntu-latest

    container:
      image: ${{ inputs.image }}  # zizmor: ignore[unpinned-images] the run's own devcontainer image, pinned by digest (ADR 0004)
      options: --user root
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash
        working-directory: ./web

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          HOME: /root
        run: ./scripts/run_tests.sh

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/coverage/cobertura-coverage.xml
          flags: js
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/test-report.junit.xml
          flags: js
          fail_ci_if_error: false
          report_type: test_results
