name: Docker

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

jobs:
  build-car:
    if: github.event.pull_request.draft != true
    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        submodules: recursive
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v7.4.0
      with:
        context: ./car
        push: ${{ github.event_name == 'push' }}
        tags: ghcr.io/ltowarek/dust-mite-car
        cache-from: type=gha
        cache-to: type=gha,mode=max

  build-controller:
    if: github.event.pull_request.draft != true
    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v7.4.0
      with:
        context: ./controller
        build-contexts: |
          root=.
        push: ${{ github.event_name == 'push' }}
        tags: ghcr.io/ltowarek/dust-mite-controller
        cache-from: type=gha
        cache-to: type=gha,mode=max

  build-web:
    if: github.event.pull_request.draft != true
    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v7.4.0
      with:
        context: ./web
        push: ${{ github.event_name == 'push' }}
        tags: ghcr.io/ltowarek/dust-mite-web
        cache-from: type=gha
        cache-to: type=gha,mode=max

  ci-status-docker:
    needs: [build-car, build-controller, build-web]
    if: always() && github.event.pull_request.draft != true
    permissions: {}
    runs-on: ubuntu-latest
    steps:
    - name: Fail if any needed job did not succeed
      if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
      run: exit 1
