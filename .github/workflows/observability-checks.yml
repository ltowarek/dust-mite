name: Observability checks

on:
  workflow_call:

jobs:
  lint:
    permissions:
      contents: read

    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ./observability

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check --no-cache-dir -r requirements/dev.txt

      - name: Run linters
        run: ./scripts/run_linters.sh --output-format=github
      - name: Run formatter
        run: ./scripts/run_formatter.sh --diff
      - name: Run type checks
        run: ./scripts/run_type_checks.sh
      - name: Run requirements checks
        run: ./scripts/run_requirements_checks.sh
