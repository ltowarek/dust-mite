name: Observability tests

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true

jobs:
  tests:
    permissions:
      contents: read

    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ./observability

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check --no-cache-dir -r requirements/dev.txt

      - name: Start observability stack
        run: docker compose -f docker-compose.yml up -d --wait otel-collector tempo mimir pyroscope loki grafana

      - name: Run synthetic pipeline tests
        env:
          GRAFANA_URL: http://localhost:3000
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
          OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://localhost:8080/otlp/v1/metrics
        run: ./scripts/run_tests.sh -- tests/integration

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: observability/results.xml
          flags: observability
          fail_ci_if_error: false
          report_type: test_results

      - name: Stop observability stack
        if: always()
        run: docker compose -f docker-compose.yml down
