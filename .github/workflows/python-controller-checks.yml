name: Python controller checks

on:
  workflow_call:
    inputs:
      image:
        description: The Python devcontainer image, referenced by digest
        required: true
        type: string

jobs:
  lint:
    permissions:
      contents: read

    runs-on: ubuntu-latest

    container:
      image: ${{ inputs.image }}  # zizmor: ignore[unpinned-images] the run's own devcontainer image, pinned by digest (ADR 0004)
      options: --user root
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash
        working-directory: ./controller

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Activate venv
        run: |
          source /home/vscode/venv/bin/activate
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"

      - name: Install package
        run: pip install --disable-pip-version-check --no-cache-dir -e .

      - name: Run linters
        run: ./scripts/run_linters.sh --output-format=github
      - name: Run formatter
        run: ./scripts/run_formatter.sh --diff
      - name: Run type checks
        run: ./scripts/run_type_checks.sh
      - name: Run requirements checks
        run: ./scripts/run_requirements_checks.sh
