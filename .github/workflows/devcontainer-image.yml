name: Devcontainer image

on:
  workflow_call:
    inputs:
      file:
        description: Path to the Dockerfile
        required: true
        type: string
      image:
        description: Image name without a tag, such as ghcr.io/owner/name
        required: true
        type: string
    outputs:
      image:
        description: The pushed image, referenced by digest
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BUILDCACHE: type=registry,ref=${{ inputs.image }}:buildcache

    outputs:
      image: ${{ inputs.image }}@${{ steps.build.outputs.digest }}

    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6.2.0
      with:
        images: ${{ inputs.image }}
        tags: type=sha

    - name: Build and push
      id: build
      uses: docker/build-push-action@v7.4.0
      with:
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        file: ${{ inputs.file }}
        push: true
        cache-from: ${{ env.BUILDCACHE }}
        cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('{0},mode=max', env.BUILDCACHE) || '' }}
