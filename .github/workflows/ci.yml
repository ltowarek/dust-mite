name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  publish:
    permissions:
      contents: read
      packages: write

    uses: $/.github/workflows/publish.yml
    with:
      dry-run: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  cpp-car-checks:
    needs: publish
    permissions:
      contents: read

    uses: $/.github/workflows/cpp-car-checks.yml
    with:
      image: ${{ needs.publish.outputs.cpp-car-image }}

  infrastructure-checks:
    needs: publish
    permissions:
      actions: write
      checks: read
      contents: read
      issues: read
      pull-requests: read

    uses: $/.github/workflows/infrastructure-checks.yml
    with:
      image: ${{ needs.publish.outputs.infrastructure-image }}
    secrets:
      AFK_APP_PRIVATE_KEY: ${{ secrets.AFK_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  js-web-checks:
    needs: publish
    permissions:
      contents: read

    uses: $/.github/workflows/js-web-checks.yml
    with:
      image: ${{ needs.publish.outputs.js-web-image }}

  observability-checks:
    permissions:
      contents: read

    uses: $/.github/workflows/observability-checks.yml

  python-controller-checks:
    needs: publish
    permissions:
      contents: read

    uses: $/.github/workflows/python-controller-checks.yml
    with:
      image: ${{ needs.publish.outputs.python-controller-image }}

  ci-status:
    needs:
      - publish
      - cpp-car-checks
      - infrastructure-checks
      - js-web-checks
      - observability-checks
      - python-controller-checks
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
