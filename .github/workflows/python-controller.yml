name: Python controller

on: 
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: 
      - main

jobs:
  build-docker:
    if: github.event.pull_request.draft != true
    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/devcontainer-image.yml
    with:
      file: ./.devcontainer/python/Dockerfile
      image: ghcr.io/ltowarek/dust-mite-python-devcontainer

  run-checks:
    needs: build-docker
    permissions:
      contents: read

    runs-on: ubuntu-latest

    container:
      image: ${{ needs.build-docker.outputs.image }}
      options: --user root
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash
        working-directory: ./controller

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - name: Activate venv
      run: |
        source /home/vscode/venv/bin/activate
        echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
        echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH

    - name: Install package
      run: pip install --disable-pip-version-check --no-cache-dir -e .

    - name: Run linters
      run: ./scripts/run_linters.sh --output-format=github
    - name: Run formatter
      run: ./scripts/run_formatter.sh --diff
    - name: Run type checks
      run: ./scripts/run_type_checks.sh
    - name: Run requirements checks
      run: ./scripts/run_requirements_checks.sh

    - name: Run tests
      run: ./scripts/run_tests.sh

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5.5.5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: controller/coverage.xml
        flags: python
        fail_ci_if_error: false

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@v5.5.5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: controller/results.xml
        flags: python
        fail_ci_if_error: false
        report_type: test_results


  ci-status-python-controller:
    needs: [build-docker, run-checks]
    if: always() && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
    - name: Fail if any needed job did not succeed
      if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
      run: exit 1
