name: Python controller

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true

jobs:
  build-docker:
    permissions:
      contents: read
      packages: write

    uses: $/.github/workflows/devcontainer-image.yml
    with:
      file: ./.devcontainer/python/Dockerfile
      image: ghcr.io/ltowarek/dust-mite-python-devcontainer

  run-checks:
    needs: build-docker
    permissions:
      contents: read

    runs-on: ubuntu-latest

    container:
      image: ${{ needs.build-docker.outputs.image }}  # zizmor: ignore[unpinned-images] the run's own devcontainer image, pinned by digest (ADR 0004)
      options: --user root
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash
        working-directory: ./controller

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Activate venv
        run: |
          source /home/vscode/venv/bin/activate
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"

      - name: Install package
        run: pip install --disable-pip-version-check --no-cache-dir -e .

      - name: Run linters
        run: ./scripts/run_linters.sh --output-format=github
      - name: Run formatter
        run: ./scripts/run_formatter.sh --diff
      - name: Run type checks
        run: ./scripts/run_type_checks.sh
      - name: Run requirements checks
        run: ./scripts/run_requirements_checks.sh

      - name: Run tests
        run: ./scripts/run_tests.sh

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: controller/coverage.xml
          flags: python
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: controller/results.xml
          flags: python
          fail_ci_if_error: false
          report_type: test_results
