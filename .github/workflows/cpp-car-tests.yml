name: C++ car tests

on:
  workflow_call:
    inputs:
      image:
        description: The C++ devcontainer image, referenced by digest
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:
        required: true

jobs:
  qemu:
    permissions:
      contents: read

    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: test-telemetry
            path: car/components/telemetry/test_apps
            pytest_pattern: pytest_telemetry_qemu.py
          - name: test-web_server
            path: car/components/web_server/test_apps
            pytest_pattern: pytest_web_server.py

    container:
      image: ${{ inputs.image }}  # zizmor: ignore[unpinned-images] the run's own devcontainer image, pinned by digest (ADR 0004)
      options: --user root
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Cache ccache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-idf-${{ matrix.path }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-idf-${{ matrix.path }}-
            ccache-${{ runner.os }}-idf-

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          SDKCONFIG_DEFAULTS: sdkconfig.defaults;sdkconfig.defaults.qemu
        run: |
          source "$IDF_PATH/export.sh"
          idf.py build
        working-directory: ${{ matrix.path }}

      - name: Run QEMU tests
        run: car/scripts/run_qemu_tests.sh ${{ matrix.path }} ${{ matrix.pytest_pattern }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ matrix.path }}/results.xml
          flags: cpp
          fail_ci_if_error: false
          report_type: test_results

  ubsan:
    permissions:
      contents: read

    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: telemetry
            component_path: components/telemetry/test_apps
            pytest_pattern: pytest_telemetry_qemu.py
          - name: web_server
            component_path: components/web_server/test_apps
            pytest_pattern: pytest_web_server.py

    container:
      image: ${{ inputs.image }}  # zizmor: ignore[unpinned-images] the run's own devcontainer image, pinned by digest (ADR 0004)
      options: --user root
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash
        working-directory: car

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Cache ccache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-idf-ubsan-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-idf-ubsan-${{ matrix.name }}-
            ccache-${{ runner.os }}-idf-ubsan-

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          SDKCONFIG_DEFAULTS: sdkconfig.defaults;sdkconfig.defaults.qemu;sdkconfig.defaults.ubsan
        run: ./scripts/run_build.sh ${{ matrix.component_path }}

      - name: Run QEMU tests
        run: ./scripts/run_qemu_tests.sh ${{ matrix.component_path }} ${{ matrix.pytest_pattern }}

  coverage:
    permissions:
      contents: read

    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: telemetry
            component_path: components/telemetry/test_apps
            pytest_pattern: pytest_telemetry_qemu.py
          - name: web_server
            component_path: components/web_server/test_apps
            pytest_pattern: pytest_web_server.py

    container:
      image: ${{ inputs.image }}  # zizmor: ignore[unpinned-images] the run's own devcontainer image, pinned by digest (ADR 0004)
      options: --user root
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash
        working-directory: car

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Cache ccache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-idf-coverage-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-idf-coverage-${{ matrix.name }}-
            ccache-${{ runner.os }}-idf-coverage-

      - name: Run coverage
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: ./scripts/run_coverage.sh ${{ matrix.component_path }} ${{ matrix.pytest_pattern }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: car/${{ matrix.component_path }}/coverage.info
          flags: cpp
          fail_ci_if_error: false
