name: AFK promote queued

on:
  issues:
    types: [closed]

permissions: {}

concurrency:
  group: afk-promote-queued
  queue: max

env:
  BLOCKING_TICKET: ${{ github.event.issue.number }}
  GH_REPO: ${{ github.repository }}

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      issues: read

    steps:
      - name: Find the queued tickets and specs that the blocking ticket unblocks
        id: queued
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUERY: |
            query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                issue(number: $number) {
                  blocking(first: 100) {
                    nodes {
                      number
                      state
                      repository { nameWithOwner }
                      parent { number labels(first: 100) { nodes { name } } }
                      labels(first: 100) { nodes { name } }
                      blockedBy(first: 100) { nodes { state } }
                    }
                  }
                }
              }
            }
        run: |
          queued=$(gh api graphql -f query="$QUERY" \
            -f owner="${GH_REPO%/*}" -f repo="${GH_REPO#*/}" -F number="$BLOCKING_TICKET" |
            jq -c --arg repo "$GH_REPO" '
              def waiting: index("agent:queued") and (index("agent:implement") | not);
              [.data.repository.issue.blocking.nodes[]
              | select(.state == "OPEN" and .repository.nameWithOwner == $repo)
              | ([.blockedBy.nodes[] | select(.state == "OPEN")] | length) as $open_blocking_tickets
              | if ([.labels.nodes[].name] | waiting) then
                  if .parent then {number, refused_parent: .parent.number}
                  elif $open_blocking_tickets == 0 then {number}
                  else empty end
                elif .parent and ([.parent.labels.nodes[].name] | waiting) and $open_blocking_tickets == 0 then
                  {number: .parent.number}
                else empty end]
              | unique_by(.number)')
          echo "Queued tickets: $queued"
          echo "tickets=$queued" >> "$GITHUB_OUTPUT"

      - name: Mint the App's write token for labels and comments
        id: write-token
        if: steps.queued.outputs.tickets != '[]'
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.AFK_APP_CLIENT_ID }}
          private-key: ${{ secrets.AFK_APP_PRIVATE_KEY }}
          permission-issues: write

      - name: Promote the unblocked tickets and specs, and refuse child tickets
        if: steps.queued.outputs.tickets != '[]'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
          TICKETS: ${{ steps.queued.outputs.tickets }}
        run: |
          jq -c '.[]' <<<"$TICKETS" | while IFS= read -r ticket; do
            number=$(jq -r .number <<<"$ticket")
            parent=$(jq -r '.refused_parent // empty' <<<"$ticket")
            if [ -n "$parent" ]; then
              gh issue edit "$number" --remove-label agent:queued --add-label agent:blocked
              gh issue comment "$number" --body "Refused to promote: this ticket is a child ticket of #${parent}. Child tickets run only through their spec; add \`agent:implement\` to #${parent} instead."
            else
              gh issue edit "$number" --remove-label agent:queued --add-label agent:implement
            fi
          done
