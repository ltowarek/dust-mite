name: AFK promote queued

on:
  issues:
    types: [closed]

permissions: {}

concurrency:
  group: afk-promote-queued
  queue: max

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      actions: write
      issues: read

    steps:
      - name: Mint the App's write token for labels and comments
        id: write-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.AFK_APP_CLIENT_ID }}
          private-key: ${{ secrets.AFK_APP_PRIVATE_KEY }}
          permission-issues: write

      - name: Promote the unblocked tickets and specs, and refuse child tickets
        uses: $/.github/actions/afk-promote-queued
        with:
          blocking-ticket: ${{ github.event.issue.number }}
          app-token: ${{ steps.write-token.outputs.token }}
          workflow-token: ${{ github.token }}
          bot-id: ${{ vars.AFK_APP_BOT_ID }}
