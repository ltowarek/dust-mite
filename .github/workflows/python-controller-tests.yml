name: Python controller tests

on:
  workflow_call:
    inputs:
      image:
        description: The Python devcontainer image, referenced by digest
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:
        required: true

jobs:
  tests:
    permissions:
      contents: read

    runs-on: ubuntu-latest

    container:
      image: ${{ inputs.image }}  # zizmor: ignore[unpinned-images] the run's own devcontainer image, pinned by digest (ADR 0004)
      options: --user root
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash
        working-directory: ./controller

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Activate venv
        run: |
          source /home/vscode/venv/bin/activate
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"

      - name: Install package
        run: pip install --disable-pip-version-check --no-cache-dir -e .

      - name: Run tests
        run: ./scripts/run_tests.sh

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: controller/coverage.xml
          flags: python
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: controller/results.xml
          flags: python
          fail_ci_if_error: false
          report_type: test_results
