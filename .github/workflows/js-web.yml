name: JavaScript web

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

jobs:
  build-docker:
    if: github.event.pull_request.draft != true
    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/devcontainer-image.yml
    with:
      file: ./.devcontainer/js/Dockerfile
      image: ghcr.io/ltowarek/dust-mite-js-devcontainer

  run-checks:
    needs: build-docker
    permissions:
      contents: read

    runs-on: ubuntu-latest

    container:
      image: ${{ needs.build-docker.outputs.image }}
      options: --user root
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash
        working-directory: ./web

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Install dependencies
      run: npm ci

    - name: Run linters
      run: ./scripts/run_linters.sh
    - name: Run formatter
      run: ./scripts/run_formatter.sh --check
    - name: Run build
      run: ./scripts/run_build.sh
    - name: Run tests
      env:
        HOME: /root
      run: ./scripts/run_tests.sh

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: web/coverage/cobertura-coverage.xml
        flags: js
        fail_ci_if_error: false

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: web/test-report.junit.xml
        flags: js
        fail_ci_if_error: false
        report_type: test_results


  ci-status-js-web:
    needs: [build-docker, run-checks]
    if: always() && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
    - name: Fail if any needed job did not succeed
      if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
      run: exit 1
