name: AFK run on a PR
run-name: 'afk implement #${{ inputs.number }}'

on:
  workflow_dispatch:
    inputs:
      number:
        description: The PR
        required: true
        type: number
      comment-id:
        description: The AFK command's comment; empty when started from the Actions tab
        required: false
        type: string
      head-sha:
        description: The PR's head when the AFK command was accepted; empty for the current head
        required: false
        type: string
  workflow_call:
    inputs:
      number:
        description: The PR
        required: true
        type: number
      comment-id:
        description: The AFK command's comment; empty when started from the Actions tab
        required: false
        type: string
      head-sha:
        description: The PR's head when the AFK command was accepted; empty for the current head
        required: false
        type: string
      dry-run:
        description: Report the writes in the effects outputs instead of making them
        required: false
        type: boolean
        default: false
      model:
        description: The agent's model
        required: false
        type: string
        default: claude-opus-5-5
      effort:
        description: The agent's effort
        required: false
        type: string
        default: medium
    secrets:
      AFK_APP_PRIVATE_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
    outputs:
      publish-effects:
        description: The publish phase's planned writes as a JSON array, set only in a dry run
        value: ${{ jobs.implement.outputs.effects }}
      finish-effects:
        description: The finish phase's planned writes as a JSON array, set only in a dry run
        value: ${{ jobs.finish.outputs.effects }}

permissions: {}

# Shares the AFK queue with afk-run.yml; a dry run stays out of it.
concurrency:
  group: ${{ inputs.dry-run && format('afk-run-pr-dry-run-{0}', github.run_id) || 'afk-run' }}
  queue: max

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read

    outputs:
      refusal: ${{ steps.check.outputs.refusal }}
      url: ${{ steps.check.outputs.url }}
      branch: ${{ steps.check.outputs.branch }}
      head-sha: ${{ steps.check.outputs.head-sha }}
      conversation: ${{ steps.check.outputs.conversation }}

    steps:
      - name: Mint the App's write token for the label
        id: write-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.AFK_APP_CLIENT_ID }}
          private-key: ${{ secrets.AFK_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      # A run started from the Actions tab has no dispatcher to add the label.
      - name: Mark the PR in progress, and read its unresolved conversation
        id: check
        uses: $/.github/actions/afk-run-pr-check
        with:
          number: ${{ inputs.number }}
          head-sha: ${{ inputs.head-sha }}
          app-token: ${{ steps.write-token.outputs.token }}
          workflow-token: ${{ github.token }}
          dry-run: ${{ inputs.dry-run }}

  implement:
    needs: check
    if: needs.check.outputs.refusal == ''
    runs-on: ubuntu-latest
    timeout-minutes: 180

    permissions:
      contents: read

    outputs:
      agent-error: ${{ steps.publish.outputs.agent-error }}
      agent-output: ${{ steps.agent.outputs.structured_output }}
      effects: ${{ steps.publish.outputs.effects }}

    env:
      BRANCH: ${{ needs.check.outputs.branch }}
      HEAD_SHA: ${{ needs.check.outputs.head-sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.check.outputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Switch to the PR's branch
        run: git switch -c "$BRANCH"

      - name: Write .env
        run: ./scripts/dump_env.sh

      - name: Write the unresolved conversation for the agent
        env:
          CONVERSATION: ${{ needs.check.outputs.conversation }}
        run: jq . <<<"$CONVERSATION" > "$RUNNER_TEMP/pr-conversation.json"

      # From the workflow's own commit, not the checkout.
      - name: Read the agent's output schema
        id: schema
        uses: $/.github/actions/afk-agent-schema
        with:
          schema: afk-run-pr-output.schema.json

      - name: Mint the App's read-only token for the agent
        id: read-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.AFK_APP_CLIENT_ID }}
          private-key: ${{ secrets.AFK_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      # Matt Pocock's implement-pr prompt, adapted to a read-only agent and structured output.
      - name: Run the AFK agent session
        id: agent
        uses: anthropics/claude-code-action@v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.read-token.outputs.token }}
          bot_name: ${{ vars.AFK_APP_SLUG }}[bot]
          bot_id: ${{ vars.AFK_APP_BOT_ID }}
          # The AFK dispatcher's GITHUB_TOKEN starts a run as github-actions; a dry run in a Dependabot pull request's CI starts as Dependabot.
          allowed_bots: ${{ inputs.dry-run && 'github-actions,dependabot' || 'github-actions' }}
          prompt: |
            # TASK

            You are addressing reviewer feedback on PR ${{ needs.check.outputs.url }}, checked out on the current branch.

            Unlike a review, your job is **not** to compare the code against a spec or coding standards. Your job is to read the unresolved conversation on this PR, decide what (if anything) to change in the code, make those changes, and explain yourself by commenting back where useful.

            # CONTEXT

            Read `GLOSSARY.md` and any relevant ADRs under `docs/adr/` if you need domain context for a comment. Don't go deeper than the comments demand.
            Read the PR with `gh pr view`, and the ticket it closes, if any, with `gh issue view <number> --comments`. `git diff origin/main...HEAD --stat` shows the PR's diff.

            The unresolved conversation on this PR is in `${{ runner.temp }}/pr-conversation.json`. Tagged by surface:

            - `issue_comments`: top-level PR conversation comments.
            - `review_threads`: inline threads anchored to a file and line. Only **unresolved** threads are included. Reply to a thread with its `comment_id`.
            - `review_summaries`: top-level bodies of submitted reviews.

            Not everything in here is necessarily actionable: reviewers may leave context, questions, asides, or things they meant to resolve. Use your judgement. **Do not treat unresolved == must-action.**

            # PROCESS

            1. Read the conversation. For each item, classify it in your head as: code change needed, reply needed (question / disagreement / clarification), or neither.
            2. Make the code changes you decided on. Follow CLAUDE.md, including running every check inside the devcontainer it names before committing; Docker is available. Use Conventional Commits messages, with a body that says why.
            3. If you made no changes that's fine: only commit when there's a real diff.

            Reply in every thread whose request you changed code for, confirming what you changed and in which commit. Reply in other threads only where a reply adds value: explaining why you chose not to make a requested change, answering a question, or pointing out something the reviewer should look at. Silence is fine for context-only comments.

            You cannot resolve threads. Resolution is the reviewer's job.

            # OUTPUT

            This is an AFK agent session: no one will answer questions. Commit to the current branch. Do not push, comment, file tickets, or change labels; the workflow posts your output.
            - `thread_replies`: replies in a thread, by its `comment_id` from the conversation file.
            - `inline_comments`: new inline comments on a line of the PR's diff at HEAD, when a thread reply isn't the right surface.
            - `top_level_comments`: new top-level PR comments, for cross-cutting summaries.
            A comment that raises a spec gap, as docs/agents/spec-gaps.md defines it, gets your question as a thread reply, or as a top-level comment when it is not in a thread; make no change for it.
            Follow docs/agents/follow-up-tickets.md: list follow-up tickets in follow_ups and follow-ups already covered in already_covered.
            Set needs_dut_run to whether your commits can only be confirmed by a DUT run on the car, judged from the change itself; if they can, set car_variant.
          # A dispatch has no model or effort input.
          claude_args: >-
            --model ${{ inputs.model || 'claude-opus-5-5' }} --effort ${{ inputs.effort || 'medium' }}
            --allowedTools Bash,Read,Edit,Write,Glob,Grep,Task,TodoWrite
            --json-schema '${{ steps.schema.outputs.json }}'

      - name: Mint the App's write token for the push, comments and the label
        id: write-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.AFK_APP_CLIENT_ID }}
          private-key: ${{ secrets.AFK_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      # Also after a failed agent, so that the action sets the agent's error for finish.
      - name: Push the agent's commits and post its replies and comments
        id: publish
        if: '!cancelled()'
        uses: $/.github/actions/afk-run-pr-publish
        with:
          number: ${{ inputs.number }}
          branch: ${{ env.BRANCH }}
          head-sha: ${{ env.HEAD_SHA }}
          agent-outcome: ${{ steps.agent.outcome }}
          agent-output: ${{ steps.agent.outputs.structured_output }}
          execution-file: ${{ steps.agent.outputs.execution_file }}
          app-token: ${{ steps.write-token.outputs.token }}
          dry-run: ${{ inputs.dry-run }}

  finish:
    needs: [check, implement]
    if: always()
    runs-on: ubuntu-latest

    permissions:
      actions: read
      checks: read

    outputs:
      effects: ${{ steps.finish.outputs.effects }}

    steps:
      - name: Mint the App's write token for tickets, labels and comments
        id: write-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.AFK_APP_CLIENT_ID }}
          private-key: ${{ secrets.AFK_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      - name: Report how the run ended, and release the PR
        id: finish
        uses: $/.github/actions/afk-finish
        with:
          workflow: afk-run-pr
          ticket: ${{ inputs.number }}
          comment-id: ${{ inputs.comment-id }}
          needs: ${{ toJSON(needs) }}
          app-token: ${{ steps.write-token.outputs.token }}
          workflow-token: ${{ github.token }}
          dry-run: ${{ inputs.dry-run }}
