name: Infrastructure

on:
  workflow_call:
    secrets:
      AFK_APP_PRIVATE_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  build-docker:
    permissions:
      contents: read
      packages: write

    uses: $/.github/workflows/devcontainer-image.yml
    with:
      file: ./.devcontainer/infrastructure/Dockerfile
      image: ghcr.io/ltowarek/dust-mite-infrastructure-devcontainer

  actionlint:
    needs: build-docker
    permissions:
      contents: read

    runs-on: ubuntu-latest

    container:
      image: ${{ needs.build-docker.outputs.image }}  # zizmor: ignore[unpinned-images] the run's own devcontainer image, pinned by digest (ADR 0004)
      options: --user root
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        run: ./scripts/run_actionlint.sh -format '{{range .}}::error file={{.Filepath}},line={{.Line}},col={{.Column}}::{{.Message}}\n{{end}}'

  shellcheck:
    needs: build-docker
    permissions:
      contents: read

    runs-on: ubuntu-latest

    container:
      image: ${{ needs.build-docker.outputs.image }}  # zizmor: ignore[unpinned-images] the run's own devcontainer image, pinned by digest (ADR 0004)
      options: --user root
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run ShellCheck
        run: |
          # The checkout is owned by the runner user, not the container's root.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/run_shellcheck.sh

  shfmt:
    needs: build-docker
    permissions:
      contents: read

    runs-on: ubuntu-latest

    container:
      image: ${{ needs.build-docker.outputs.image }}  # zizmor: ignore[unpinned-images] the run's own devcontainer image, pinned by digest (ADR 0004)
      options: --user root
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run shfmt
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/run_shfmt.sh --diff

  yamllint:
    needs: build-docker
    permissions:
      contents: read

    runs-on: ubuntu-latest

    container:
      image: ${{ needs.build-docker.outputs.image }}  # zizmor: ignore[unpinned-images] the run's own devcontainer image, pinned by digest (ADR 0004)
      options: --user root
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run yamllint
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/run_yamllint.sh -f github

  zizmor:
    needs: build-docker
    permissions:
      contents: read

    runs-on: ubuntu-latest

    container:
      image: ${{ needs.build-docker.outputs.image }}  # zizmor: ignore[unpinned-images] the run's own devcontainer image, pinned by digest (ADR 0004)
      options: --user root
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/run_zizmor.sh --format=github

  hadolint:
    needs: build-docker
    permissions:
      contents: read

    runs-on: ubuntu-latest

    container:
      image: ${{ needs.build-docker.outputs.image }}  # zizmor: ignore[unpinned-images] the run's own devcontainer image, pinned by digest (ADR 0004)
      options: --user root
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run hadolint
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/run_hadolint.sh

  afk:
    needs: build-docker
    permissions:
      contents: read

    runs-on: ubuntu-latest

    container:
      image: ${{ needs.build-docker.outputs.image }}  # zizmor: ignore[unpinned-images] the run's own devcontainer image, pinned by digest (ADR 0004)
      options: --user root
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash
        working-directory: ./tools/afk

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run linters
        run: ./scripts/run_linters.sh --output-format=github
      - name: Run formatter
        run: ./scripts/run_formatter.sh --diff
      - name: Run type checks
        run: ./scripts/run_type_checks.sh
      - name: Run requirements checks
        run: ./scripts/run_requirements_checks.sh
      - name: Run tests
        run: ./scripts/run_tests.sh

  afk-promote-queued:
    name: afk-promote-queued (${{ matrix.case }})

    # The production job's read permissions; its Actions write only dispatches, which a dry run skips.
    permissions:
      issues: read

    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        include:
          # #315 blocks #333, which is open and unblocked but not queued.
          - case: skips an unblocked ticket that is not queued
            blocking-ticket: 315
            assertion: . == []
          # #312 blocks only closed tickets.
          - case: skips closed tickets
            blocking-ticket: 312
            assertion: . == []

    steps:
      - name: Mint the App's write token for labels and comments
        id: write-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.AFK_APP_CLIENT_ID }}
          private-key: ${{ secrets.AFK_APP_PRIVATE_KEY }}
          permission-issues: write

      - name: Promote the unblocked tickets and specs as a dry run
        id: promote
        uses: $/.github/actions/afk-promote-queued
        with:
          blocking-ticket: ${{ matrix.blocking-ticket }}
          app-token: ${{ steps.write-token.outputs.token }}
          workflow-token: ${{ github.token }}
          bot-id: ${{ vars.AFK_APP_BOT_ID }}
          dry-run: true

      - name: Assert on the planned effects
        shell: bash
        env:
          EFFECTS: ${{ steps.promote.outputs.effects }}
          ASSERTION: ${{ matrix.assertion }}
        run: jq -e "$ASSERTION" <<<"$EFFECTS"

  afk-dispatch:
    name: afk-dispatch (${{ matrix.case }})

    # The production job's permissions without its Actions write, which only dispatches; the reads use the App's token.
    permissions: {}

    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        include:
          # #317 is closed, has no AFK label, and only closed tickets block it.
          - case: ignores a comment that is not a command
            number: 317
            body: '/afkimplement'
            assertion: . == []
          - case: refuses an unknown verb
            number: 317
            body: '/afk deploy'
            assertion: '.[0].body | startswith("Unknown AFK command.")'
          # #383, an AFK fixture, is closed and labelled afk:in-progress.
          - case: refuses a target in progress
            number: 383
            body: '/afk implement'
            assertion: '.[0].body | startswith("Refused: an AFK run is already queued or running here")'
          # #384, an AFK fixture, is closed and labelled afk:queued.
          - case: refuses a queued target
            number: 384
            body: '/afk implement'
            assertion: '.[0].body | startswith("Refused: this ticket is waiting")'
          # #385, an AFK fixture, is closed, has no AFK label, and is blocked by #382, which stays open.
          - case: queues a ticket with open blockers
            number: 385
            body: '/afk implement'
            assertion: '.[1] == {"type":"EditLabels","number":385,"add":["afk:queued"],"remove":["afk:blocked"]}'
          - case: dispatches an issue's AFK run
            number: 317
            body: '/afk implement'
            assertion: '.[-1] == {"type":"DispatchWorkflow","workflow":"afk-run.yml","inputs":{"number":"317","comment-id":"1"}}'
          # #372 is merged, has no AFK label, and its head is a409d69.
          - case: dispatches a PR's AFK run at its head
            number: 372
            body: '/afk implement'
            assertion: '.[-1] == {"type":"DispatchWorkflow","workflow":"afk-run-pr.yml","inputs":{"number":"372","comment-id":"1","head-sha":"a409d695e7b5cf239464dc91706ee9585251231f"}}'
          - case: dispatches a PR's branch update at its head
            number: 372
            body: '/afk update-branch'
            assertion: '.[-1] == {"type":"DispatchWorkflow","workflow":"afk-update-branch.yml","inputs":{"number":"372","comment-id":"1","head-sha":"a409d695e7b5cf239464dc91706ee9585251231f"}}'

    steps:
      - name: Mint the App's write token for reads, reactions, labels and replies
        id: write-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.AFK_APP_CLIENT_ID }}
          private-key: ${{ secrets.AFK_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      # The comment id is only written, never read, so any id stands in for it.
      - name: Refuse, queue or dispatch the AFK command as a dry run
        id: dispatch
        uses: $/.github/actions/afk-dispatch
        with:
          number: ${{ matrix.number }}
          comment-id: 1
          body: ${{ matrix.body }}
          app-token: ${{ steps.write-token.outputs.token }}
          workflow-token: ${{ github.token }}
          dry-run: true

      - name: Assert on the planned effects
        shell: bash
        env:
          EFFECTS: ${{ steps.dispatch.outputs.effects }}
          ASSERTION: ${{ matrix.assertion }}
        run: jq -e "$ASSERTION" <<<"$EFFECTS"

  afk-dispatch-release:
    name: afk-dispatch-release (${{ matrix.case }})

    # The production job's permissions without its Actions write; the release writes only with the App's token.
    permissions: {}

    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        include:
          # The release reads nothing, so #317 only names a closed ticket.
          - case: releases an accepted target
            number: 317
            accepted: 'true'
            assertion: '. == [{"type":"EditLabels","number":317,"add":[],"remove":["afk:in-progress"]},{"type":"React","comment_id":1,"content":"confused"}]'
          - case: only reacts when the command was not accepted
            number: 317
            accepted: ''
            assertion: '. == [{"type":"React","comment_id":1,"content":"confused"}]'

    steps:
      - name: Mint the App's write token for labels and reactions
        id: write-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.AFK_APP_CLIENT_ID }}
          private-key: ${{ secrets.AFK_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      - name: Release the target as a dry run
        id: release
        uses: $/.github/actions/afk-dispatch-release
        with:
          number: ${{ matrix.number }}
          comment-id: 1
          accepted: ${{ matrix.accepted }}
          app-token: ${{ steps.write-token.outputs.token }}
          dry-run: true

      - name: Assert on the planned effects
        shell: bash
        env:
          EFFECTS: ${{ steps.release.outputs.effects }}
          ASSERTION: ${{ matrix.assertion }}
        run: jq -e "$ASSERTION" <<<"$EFFECTS"

  afk-run-check:
    name: afk-run-check (${{ matrix.case }})

    # The production job's permissions.
    permissions:
      issues: read
      pull-requests: read

    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        include:
          # #217 is a closed spec whose six child tickets are all closed.
          - case: refuses a spec whose child tickets are all closed
            number: 217
            assertion: '.refusal == "Refused to run: every child ticket of this spec is closed, so there is nothing to implement." and (.block // "") == ""'
          # #239 is a closed child ticket of #217.
          - case: refuses and blocks a child ticket
            number: 239
            assertion: '.refusal == "Refused to run: this ticket is a child ticket of #217. Child tickets run only through their spec; comment `/afk implement` on #217 instead." and .block == "true"'
          # #253 is closed and has no parent, child tickets, blocking tickets or open PR.
          - case: runs a plain ticket on its own branch in one run
            number: 253
            assertion: '([.refusal, .queue, .spec] | all((. // "") == "")) and .branch == "afk/issue-253-\(env.GITHUB_RUN_ID)" and .["last-run"] == "true"'
          - case: reports the in-progress mark as a dry run
            number: 253
            assertion: '.effects | fromjson == [{"type": "EditLabels", "number": 253, "add": ["afk:in-progress"], "remove": []}]'

    steps:
      - name: Mint the App's write token for the label
        id: write-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.AFK_APP_CLIENT_ID }}
          private-key: ${{ secrets.AFK_APP_PRIVATE_KEY }}
          permission-issues: write

      - name: Check the ticket as a dry run
        id: check
        uses: $/.github/actions/afk-run-check
        with:
          number: ${{ matrix.number }}
          app-token: ${{ steps.write-token.outputs.token }}
          workflow-token: ${{ github.token }}
          dry-run: true

      - name: Assert on the outputs
        shell: bash
        env:
          OUTPUTS: ${{ toJSON(steps.check.outputs) }}
          ASSERTION: ${{ matrix.assertion }}
        run: jq -e "$ASSERTION" <<<"$OUTPUTS"

  afk-run-pr-check:
    name: afk-run-pr-check (${{ matrix.case }})

    # The production job's permissions.
    permissions:
      pull-requests: read

    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        include:
          # #391 is merged.
          - case: refuses a PR that is not open
            number: 391
            assertion: '.refusal == "Refused to run: this PR is not open."'
          # The canary PR is an open draft from this repository with one unresolved review thread.
          - case: reads the canary PR's unresolved conversation
            number: ${{ vars.AFK_CANARY_PR }}
            assertion: '(.refusal // "") == "" and .branch != "" and (.conversation | fromjson | .review_threads | length) >= 1'
          - case: works on the head that the AFK command was accepted at
            number: ${{ vars.AFK_CANARY_PR }}
            head-sha: 0123456789abcdef0123456789abcdef01234567
            assertion: '.["head-sha"] == "0123456789abcdef0123456789abcdef01234567"'
          - case: reports the in-progress mark as a dry run
            number: ${{ vars.AFK_CANARY_PR }}
            assertion: '.effects | fromjson == [{"type": "EditLabels", "number": (env.AFK_CANARY_PR | tonumber), "add": ["afk:in-progress"], "remove": []}]'

    steps:
      - name: Mint the App's write token for the label
        id: write-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.AFK_APP_CLIENT_ID }}
          private-key: ${{ secrets.AFK_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      - name: Check the PR as a dry run
        id: check
        uses: $/.github/actions/afk-run-pr-check
        with:
          number: ${{ matrix.number }}
          head-sha: ${{ matrix.head-sha }}
          app-token: ${{ steps.write-token.outputs.token }}
          workflow-token: ${{ github.token }}
          dry-run: true

      - name: Assert on the outputs
        shell: bash
        env:
          AFK_CANARY_PR: ${{ vars.AFK_CANARY_PR }}
          OUTPUTS: ${{ toJSON(steps.check.outputs) }}
          ASSERTION: ${{ matrix.assertion }}
        run: jq -e "$ASSERTION" <<<"$OUTPUTS"

  afk-update-branch-check:
    name: afk-update-branch-check (${{ matrix.case }})

    # The production job's permissions.
    permissions:
      issues: read
      pull-requests: read

    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        include:
          # #331 is an issue.
          - case: refuses an issue
            number: 331
            assertion: '.refusal == "Refused to run: this is not a PR, and `/afk update-branch` works only on a PR."'
          # #391 is merged.
          - case: refuses a PR that is not open
            number: 391
            assertion: '.refusal == "Refused to run: this PR is merged."'
          # The canary PR is an open draft from this repository.
          - case: goes ahead on the canary PR's branch
            number: ${{ vars.AFK_CANARY_PR }}
            assertion: '(.refusal // "") == "" and .branch != "" and (.["head-sha"] | length) == 40'
          - case: works on the head that the AFK command was accepted at
            number: ${{ vars.AFK_CANARY_PR }}
            head-sha: 0123456789abcdef0123456789abcdef01234567
            assertion: '.["head-sha"] == "0123456789abcdef0123456789abcdef01234567"'
          - case: reports the in-progress mark as a dry run
            number: ${{ vars.AFK_CANARY_PR }}
            assertion: '.effects | fromjson == [{"type": "EditLabels", "number": (env.AFK_CANARY_PR | tonumber), "add": ["afk:in-progress"], "remove": []}]'

    steps:
      - name: Mint the App's write token for the label
        id: write-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.AFK_APP_CLIENT_ID }}
          private-key: ${{ secrets.AFK_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      - name: Check the PR as a dry run
        id: check
        uses: $/.github/actions/afk-update-branch-check
        with:
          number: ${{ matrix.number }}
          head-sha: ${{ matrix.head-sha }}
          app-token: ${{ steps.write-token.outputs.token }}
          workflow-token: ${{ github.token }}
          dry-run: true

      - name: Assert on the outputs
        shell: bash
        env:
          AFK_CANARY_PR: ${{ vars.AFK_CANARY_PR }}
          OUTPUTS: ${{ toJSON(steps.check.outputs) }}
          ASSERTION: ${{ matrix.assertion }}
        run: jq -e "$ASSERTION" <<<"$OUTPUTS"

  afk-update-branch-merge:
    name: afk-update-branch-merge (${{ matrix.case }})

    # The production job's permissions; the merge is local.
    permissions:
      contents: read

    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        include:
          - case: merges nothing when the branch already contains main
            branch-change: docs/afk-canary.md
            assertion: '.merge == "up-to-date" and .unmerged == ""'
          - case: merges main without conflicts
            main-change: docs/afk-canary-main.md
            branch-change: docs/afk-canary.md
            assertion: '.merge == "clean" and .unmerged == "" and .head_parents == 2'
          - case: leaves the conflicts for the agent
            main-change: docs/afk-canary.md
            branch-change: docs/afk-canary.md
            assertion: '.merge == "conflict" and .unmerged == "docs/afk-canary.md"'

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # main gains its change on top of the checkout, and the PR's head gains its own beside it.
      - name: Build main and the PR's head
        id: commits
        env:
          MAIN_CHANGE: ${{ matrix.main-change }}
          BRANCH_CHANGE: ${{ matrix.branch-change }}
        run: |
          commit() {
            echo "$2" >> "$1"
            git add "$1"
            git -c user.name=afk-test -c user.email=afk-test@users.noreply.github.com commit --quiet -m "docs: $2"
          }
          base=$(git rev-parse HEAD)
          if [ -n "$MAIN_CHANGE" ]; then commit "$MAIN_CHANGE" main; fi
          git update-ref refs/remotes/origin/main HEAD
          echo "main=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git switch --quiet --detach "$base"
          commit "$BRANCH_CHANGE" branch

      - name: Merge main
        id: merge
        uses: $/.github/actions/afk-update-branch-merge
        with:
          bot-name: afk-test[bot]
          bot-id: "1"

      - name: Assert on the outputs and the working tree
        shell: bash
        env:
          MAIN: ${{ steps.commits.outputs.main }}
          OUTPUTS: ${{ toJSON(steps.merge.outputs) }}
          ASSERTION: ${{ matrix.assertion }}
        run: |
          jq -e --arg main "$MAIN" '.["main-sha"] == $main' <<<"$OUTPUTS"
          jq -e --arg unmerged "$(git diff --name-only --diff-filter=U)" \
            --argjson parents "$(git rev-list --parents -n 1 HEAD | wc -w)" \
            ". + {unmerged: \$unmerged, head_parents: (\$parents - 1)} | $ASSERTION" <<<"$OUTPUTS"

  afk-update-branch-publish:
    name: afk-update-branch-publish (${{ matrix.case }})

    # The production job's permissions; publish reads only the checkout, and a dry run skips the writes.
    permissions:
      contents: read

    runs-on: ubuntu-latest
    timeout-minutes: 5

    # The action reads no PR, so each case names the merged #391.
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: comments that an up-to-date branch needs no push
            branch-change: docs/afk-canary.md
            assertion: '(.effects | map(.type)) == ["Comment"] and (.effects[0].body | startswith("The branch already contains `main`"))'
          - case: pushes a clean merge with a lease on the PR's head
            main-change: docs/afk-canary-main.md
            branch-change: docs/afk-canary.md
            assertion: '(.effects | map(.type)) == ["PushBranch","Comment"] and .effects[0].lease == .head and (.effects[1].body | startswith("Merged `main`"))'
          # main also changes tools/, which the refusal ignores because the agent did not write it.
          - case: pushes the agent's resolution, comments it and labels the PR for the car
            main-change: docs/afk-canary.md tools/afk-canary.md
            branch-change: docs/afk-canary.md
            resolve: true
            output:
              conflict_summary: Kept both lines.
              needs_dut_run: true
              car_variant: copper
            assertion: '(.effects | map(.type)) == ["PushBranch","Comment","EditLabels"] and (.effects[1].body | endswith("\n\nKept both lines.\n")) and .effects[2].add == ["needs-car:copper"]'
          - case: fails when the agent leaves the merge unfinished
            main-change: docs/afk-canary.md
            branch-change: docs/afk-canary.md
            output:
              conflict_summary: Kept both lines.
              needs_dut_run: false
            assertion: '.outcome == "failure" and .effects == null'
          - case: refuses an agent resolution that changes tools/
            main-change: docs/afk-canary.md
            branch-change: docs/afk-canary.md
            resolve: true
            agent-change: tools/afk-canary.md
            output:
              conflict_summary: Kept both lines.
              needs_dut_run: false
            assertion: '.outcome == "failure" and .effects == null'

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # main gains its changes on top of the checkout, and the PR's head gains its own beside it.
      - name: Build main and the PR's head
        id: commits
        env:
          MAIN_CHANGE: ${{ matrix.main-change }}
          BRANCH_CHANGE: ${{ matrix.branch-change }}
        run: |
          commit() {
            for path in $1; do
              echo "$2" >> "$path"
              git add "$path"
            done
            git -c user.name=afk-test -c user.email=afk-test@users.noreply.github.com commit --quiet -m "docs: $2"
          }
          base=$(git rev-parse HEAD)
          if [ -n "$MAIN_CHANGE" ]; then commit "$MAIN_CHANGE" main; fi
          git update-ref refs/remotes/origin/main HEAD
          git switch --quiet --detach "$base"
          commit "$BRANCH_CHANGE" branch
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Merge main
        id: merge
        uses: $/.github/actions/afk-update-branch-merge
        with:
          bot-name: afk-test[bot]
          bot-id: "1"

      - name: Resolve the conflicts as the agent
        if: matrix.resolve
        env:
          AGENT_CHANGE: ${{ matrix.agent-change }}
        run: |
          git diff --name-only --diff-filter=U | while IFS= read -r path; do
            echo resolved > "$path"
            git add "$path"
          done
          if [ -n "$AGENT_CHANGE" ]; then
            echo agent >> "$AGENT_CHANGE"
            git add "$AGENT_CHANGE"
          fi
          git commit --quiet --no-edit

      - name: Mint the App's write token for the push, the comment and the label
        id: write-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.AFK_APP_CLIENT_ID }}
          private-key: ${{ secrets.AFK_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Publish the merge as a dry run
        id: publish
        # A refusal fails the step; the assertion checks its outcome.
        continue-on-error: true
        uses: $/.github/actions/afk-update-branch-publish
        with:
          number: 391
          branch: afk-test/update-branch-391-${{ github.run_id }}
          head-sha: ${{ steps.commits.outputs.head }}
          main-sha: ${{ steps.merge.outputs.main-sha }}
          merge: ${{ steps.merge.outputs.merge }}
          agent-outcome: success
          agent-output: ${{ matrix.output && toJSON(matrix.output) || '' }}
          app-token: ${{ steps.write-token.outputs.token }}
          dry-run: true

      - name: Assert on the outcome and the planned effects
        shell: bash
        env:
          HEAD: ${{ steps.commits.outputs.head }}
          OUTCOME: ${{ steps.publish.outcome }}
          EFFECTS: ${{ steps.publish.outputs.effects }}
          ASSERTION: ${{ matrix.assertion }}
        run: |
          jq -e -n --arg head "$HEAD" --arg outcome "$OUTCOME" --argjson effects "${EFFECTS:-null}" \
            "{head: \$head, outcome: \$outcome, effects: \$effects} | $ASSERTION"

  afk-run-publish:
    name: afk-run-publish (${{ matrix.case }})

    # The production implement job's permissions; the App's token does the reads, and a dry run skips the writes.
    permissions:
      contents: read

    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        include:
          # #315 is closed; publish reads only the open PRs of the test's own branch, which has none.
          - case: pushes and opens a draft PR that closes the ticket
            changed-file: docs/afk-canary.md
            output:
              outcome: done
              pr_title: "docs: append canary"
              pr_body: Appends the line.
              needs_dut_run: false
            assertion: '(.effects | map(.type)) == ["PushBranch","CreatePullRequest","MarkPullRequestReady"] and (.effects[1].body | startswith("Closes #315\n"))'
          - case: hands a spec gap back to triage
            output:
              outcome: spec_gap
              spec_gaps: Which line?
              needs_dut_run: false
            assertion: '.effects[0] == {"type":"EditLabels","number":315,"add":["needs-triage"],"remove":["ready-for-agent"]}'
          - case: hands a needs-car stop to a car agent session
            output:
              outcome: needs_car
              needs_car_reason: Only the car shows it.
              car_variant: copper
              needs_dut_run: false
            assertion: '.effects[0] == {"type":"EditLabels","number":315,"add":["needs-car:copper"],"remove":[]}'
          - case: refuses a commit that changes .github/
            changed-file: .github/afk-canary.md
            output:
              outcome: done
              pr_title: "docs: append canary"
              pr_body: Appends the line.
              needs_dut_run: false
            assertion: '.outcome == "failure" and .effects == null'

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Switch to the branch
        id: branch
        env:
          BRANCH: afk/issue-315-${{ github.run_id }}
        run: |
          git switch -c "$BRANCH"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Commit the agent's change
        if: matrix.changed-file != ''
        env:
          CHANGED_FILE: ${{ matrix.changed-file }}
        run: |
          echo canary >> "$CHANGED_FILE"
          git add "$CHANGED_FILE"
          git -c user.name=afk-test -c user.email=afk-test@users.noreply.github.com commit --quiet -m "docs: append canary"

      - name: Mint the App's write token for the push, PR, labels and comments
        id: write-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.AFK_APP_CLIENT_ID }}
          private-key: ${{ secrets.AFK_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Publish the agent's work as a dry run
        id: publish
        # A refusal fails the step; the assertion checks its outcome.
        continue-on-error: true
        uses: $/.github/actions/afk-run-publish
        with:
          ticket: 315
          worked-ticket: 315
          branch: afk/issue-315-${{ github.run_id }}
          last-run: true
          base: ${{ steps.branch.outputs.base }}
          agent-outcome: success
          agent-output: ${{ toJSON(matrix.output) }}
          app-token: ${{ steps.write-token.outputs.token }}
          dry-run: true

      - name: Assert on the outcome and the planned effects
        shell: bash
        env:
          OUTCOME: ${{ steps.publish.outcome }}
          EFFECTS: ${{ steps.publish.outputs.effects }}
          ASSERTION: ${{ matrix.assertion }}
        run: |
          jq -e -n --arg outcome "$OUTCOME" --argjson effects "${EFFECTS:-null}" \
            "{outcome: \$outcome, effects: \$effects} | $ASSERTION"

  afk-run-pr-publish:
    name: afk-run-pr-publish (${{ matrix.case }})

    # The production implement job's permissions; publish reads only the checkout, and a dry run skips the writes.
    permissions:
      contents: read

    runs-on: ubuntu-latest
    timeout-minutes: 5

    # The action reads no PR, so each case names the merged #391.
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: pushes with a lease on the PR's head and posts the replies and comments
            changed-file: docs/afk-canary.md
            output:
              thread_replies: [{comment_id: 501, body: Added it.}]
              inline_comments: [{path: docs/afk-canary.md, line: 2, body: The new line.}]
              top_level_comments: [Appended the line.]
              needs_dut_run: false
            assertion: '(.effects | map(.type)) == ["PushBranch","ReplyToReviewComment","CreateReviewComment","Comment"] and .effects[0].lease == .base'
          - case: labels the PR for the car when its commits need a DUT run
            changed-file: docs/afk-canary.md
            output:
              thread_replies: []
              inline_comments: []
              top_level_comments: []
              needs_dut_run: true
              car_variant: copper
            assertion: '.effects[-1] == {"type":"EditLabels","number":391,"add":["needs-car:copper"],"remove":[]}'
          - case: posts only the comments when the agent made no commits
            output:
              thread_replies: []
              inline_comments: []
              top_level_comments: [Nothing to change.]
              needs_dut_run: false
            assertion: '.effects == [{"type":"Comment","number":391,"body":"Nothing to change."}]'
          - case: fails when the agent neither committed nor commented
            output:
              thread_replies: []
              inline_comments: []
              top_level_comments: []
              needs_dut_run: false
            assertion: '.outcome == "failure" and .effects == null'
          - case: refuses a commit that changes tools/
            changed-file: tools/afk-canary.md
            output:
              thread_replies: []
              inline_comments: []
              top_level_comments: [Appended the line.]
              needs_dut_run: false
            assertion: '.outcome == "failure" and .effects == null'

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Switch to the PR's branch
        id: branch
        env:
          BRANCH: afk-test/pr-391-${{ github.run_id }}
        run: |
          git switch -c "$BRANCH"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Commit the agent's change
        if: matrix.changed-file != ''
        env:
          CHANGED_FILE: ${{ matrix.changed-file }}
        run: |
          echo canary >> "$CHANGED_FILE"
          git add "$CHANGED_FILE"
          git -c user.name=afk-test -c user.email=afk-test@users.noreply.github.com commit --quiet -m "docs: append canary"

      - name: Mint the App's write token for the push, comments and the label
        id: write-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.AFK_APP_CLIENT_ID }}
          private-key: ${{ secrets.AFK_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Publish the agent's work as a dry run
        id: publish
        # A refusal fails the step; the assertion checks its outcome.
        continue-on-error: true
        uses: $/.github/actions/afk-run-pr-publish
        with:
          number: 391
          branch: afk-test/pr-391-${{ github.run_id }}
          head-sha: ${{ steps.branch.outputs.base }}
          agent-outcome: success
          agent-output: ${{ toJSON(matrix.output) }}
          app-token: ${{ steps.write-token.outputs.token }}
          dry-run: true

      - name: Assert on the outcome and the planned effects
        shell: bash
        env:
          BASE: ${{ steps.branch.outputs.base }}
          OUTCOME: ${{ steps.publish.outcome }}
          EFFECTS: ${{ steps.publish.outputs.effects }}
          ASSERTION: ${{ matrix.assertion }}
        run: |
          jq -e -n --arg base "$BASE" --arg outcome "$OUTCOME" --argjson effects "${EFFECTS:-null}" \
            "{base: \$base, outcome: \$outcome, effects: \$effects} | $ASSERTION"

  afk-finish:
    name: afk-finish (${{ matrix.case }})

    # The production job's read permissions; its Actions write only dispatches, which a dry run skips.
    permissions:
      actions: read
      checks: read

    runs-on: ubuntu-latest
    timeout-minutes: 5

    # The action reads no ticket, so each case names a closed one: #331 is the spec of the closed #363, and #391 is a merged PR.
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: refuses the ticket
            ticket: 363
            needs:
              check:
                result: success
                outputs:
                  refusal: Refused to run.
                  block: "true"
              implement:
                result: skipped
                outputs: {}
            assertion: >-
              .[0:2] == [
                {"type": "EditLabels", "number": 363, "add": ["afk:blocked"], "remove": []},
                {"type": "Comment", "number": 363, "body": "Refused to run."}
              ]
          - case: reports a failed implement job
            ticket: 363
            needs:
              check:
                result: success
                outputs: {}
              implement:
                result: failure
                outputs:
                  agent-error: Out of turns.
            assertion: >-
              any(.[]; .type == "Comment" and .number == 363
                and (.body | startswith("The AFK run failed.\n\n**Reason:** "))
                and (.body | contains("The agent reported: Out of turns.")))
          - case: continues the spec after a finished child ticket
            ticket: 331
            needs:
              check:
                result: success
                outputs:
                  spec: "true"
                  child-ticket: "363"
                  last-run: "false"
              implement:
                result: success
                outputs:
                  outcome: done
                  pr-url: https://github.com/ltowarek/dust-mite/pull/376
                  sha: 4b3c8bcbe47ce60c5ec577bcc251031b44d50c63
            assertion: >-
              map(.type) == ["CloseIssue", "EditLabels", "DispatchWorkflow"]
                and .[0] == {"type": "CloseIssue", "number": 363, "comment": "Implemented in 4b3c8bcbe47ce60c5ec577bcc251031b44d50c63"}
                and .[2].inputs == {"number": "331"}
          - case: files the follow-up tickets
            ticket: 363
            needs:
              check:
                result: success
                outputs: {}
              implement:
                result: success
                outputs:
                  outcome: spec_gap
                  agent-output: '{"outcome": "spec_gap", "needs_dut_run": false, "follow_ups": [{"title": "Fix the camera", "type": "bug", "components": ["camera"], "body": "It breaks."}]}'
            assertion: >-
              [.[] | select(.type == "CreateIssue")] | length == 1
                and .[0].title == "Fix the camera"
                and .[0].labels == ["needs-triage", "source:follow-up", "bug", "camera"]
                and (.[0].body | startswith("> *Follow-up ticket filed by an AFK agent session while working #363.*"))
          - case: reports a failed implement job on a PR
            workflow: afk-run-pr
            ticket: 391
            needs:
              check:
                result: success
                outputs: {}
              implement:
                result: failure
                outputs:
                  agent-error: Out of turns.
            assertion: >-
              any(.[]; .type == "Comment" and .number == 391
                and (.body | startswith("The AFK run on this PR failed.\n\n**Reason:** ")))
          - case: comments the follow-ups already covered on the PR
            workflow: afk-run-pr
            ticket: 391
            needs:
              check:
                result: success
                outputs: {}
              implement:
                result: success
                outputs:
                  agent-output: '{"thread_replies": [], "inline_comments": [], "top_level_comments": [], "needs_dut_run": false, "already_covered": [{"problem": "The camera breaks.", "covered_by": 363}]}'
            assertion: >-
              .[0] == {"type": "Comment", "number": 391, "body": "## Follow-ups already covered\n\n- The camera breaks. Covered by #363.\n"}
          - case: reports a failed branch update on the PR
            workflow: afk-update-branch
            ticket: 391
            needs:
              check:
                result: success
                outputs: {}
              update-branch:
                result: failure
                outputs: {}
            assertion: >-
              any(.[]; .type == "Comment" and .number == 391
                and (.body | startswith("The AFK run that updates this PR's branch failed.\n\n**Reason:** "))
                and (.body | endswith("Comment `/afk update-branch` to retry.\n")))
          - case: leaves the follow-ups already covered to the merge comment
            workflow: afk-update-branch
            ticket: 391
            needs:
              check:
                result: success
                outputs: {}
              update-branch:
                result: success
                outputs:
                  agent-output: '{"conflict_summary": "Kept both lines.", "needs_dut_run": false, "already_covered": [{"problem": "The camera breaks.", "covered_by": 363}]}'
            assertion: >-
              . == [{"type": "EditLabels", "number": 391, "add": [], "remove": ["afk:blocked"]}, {"type": "EditLabels", "number": 391, "add": [], "remove": ["afk:in-progress"]}]

    steps:
      - name: Mint the App's write token for tickets, labels and comments
        id: write-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.AFK_APP_CLIENT_ID }}
          private-key: ${{ secrets.AFK_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      - name: Finish the AFK run as a dry run
        id: finish
        uses: $/.github/actions/afk-finish
        with:
          workflow: ${{ matrix.workflow || 'afk-run' }}
          ticket: ${{ matrix.ticket }}
          needs: ${{ toJSON(matrix.needs) }}
          app-token: ${{ steps.write-token.outputs.token }}
          workflow-token: ${{ github.token }}
          dry-run: true

      - name: Assert on the planned effects
        shell: bash
        env:
          EFFECTS: ${{ steps.finish.outputs.effects }}
          ASSERTION: ${{ matrix.assertion }}
        run: jq -e "$ASSERTION" <<<"$EFFECTS"

  # The canary ticket is closed, and asks to create docs/afk-canary.md holding the line `canary`.
  afk-run-workflow:
    # Tests run on pull requests only; claude-code-action refuses a push event.
    if: github.event_name == 'pull_request'
    # The production jobs' permissions.
    permissions:
      actions: write
      checks: read
      contents: read
      issues: read
      pull-requests: read

    uses: $/.github/workflows/afk-run.yml
    with:
      number: ${{ fromJSON(vars.AFK_CANARY_TICKET) }}
      dry-run: true
      model: claude-haiku-5-5
      effort: low
    secrets:
      AFK_APP_PRIVATE_KEY: ${{ secrets.AFK_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  afk-run-workflow-assertions:
    needs: afk-run-workflow
    # Also after a failed run, whose finish effects then hold its failure comment.
    if: github.event_name == 'pull_request' && !cancelled()
    permissions: {}

    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        shell: bash

    env:
      CANARY_TICKET: ${{ vars.AFK_CANARY_TICKET }}
      PUBLISH_EFFECTS: ${{ needs.afk-run-workflow.outputs.publish-effects }}
      FINISH_EFFECTS: ${{ needs.afk-run-workflow.outputs.finish-effects }}

    steps:
      - name: Assert that publish pushes and opens a draft PR that closes the canary ticket
        run: |
          jq -e 'any(.[]; .type == "PushBranch")
            and any(.[]; .type == "CreatePullRequest" and (.body | startswith("Closes #\(env.CANARY_TICKET)\n")))' <<<"$PUBLISH_EFFECTS"

      - name: Assert that finish clears afk:in-progress
        run: |
          jq -e 'any(.[]; . == {"type": "EditLabels", "number": (env.CANARY_TICKET | tonumber), "add": [], "remove": ["afk:in-progress"]})' <<<"$FINISH_EFFECTS"

      - name: Assert that finish plans no failure comment
        run: |
          jq -e 'all(.[]; .type != "Comment" or (.body | startswith("The AFK run failed") | not))' <<<"$FINISH_EFFECTS"

  # The canary PR is an open draft whose branch creates docs/afk-canary.md holding the line `canary`, with one unresolved review comment that asks for a second line.
  afk-run-pr-workflow:
    # Tests run on pull requests only; claude-code-action refuses a push event.
    if: github.event_name == 'pull_request'
    # The production jobs' permissions.
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read

    uses: $/.github/workflows/afk-run-pr.yml
    with:
      number: ${{ fromJSON(vars.AFK_CANARY_PR) }}
      dry-run: true
      model: claude-haiku-5-5
      effort: low
    secrets:
      AFK_APP_PRIVATE_KEY: ${{ secrets.AFK_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  afk-run-pr-workflow-assertions:
    needs: afk-run-pr-workflow
    # Also after a failed run, whose finish effects then hold its failure comment.
    if: github.event_name == 'pull_request' && !cancelled()
    permissions:
      pull-requests: read

    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        shell: bash

    env:
      CANARY_PR: ${{ vars.AFK_CANARY_PR }}
      GH_REPO: ${{ github.repository }}
      PUBLISH_EFFECTS: ${{ needs.afk-run-pr-workflow.outputs.publish-effects }}
      FINISH_EFFECTS: ${{ needs.afk-run-pr-workflow.outputs.finish-effects }}

    steps:
      - name: Assert that publish pushes the agent's commits with a lease on the canary PR's head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh pr view "$CANARY_PR" --json headRefOid --jq .headRefOid)
          jq -e --arg head "$head" 'any(.[]; .type == "PushBranch" and .lease == $head)' <<<"$PUBLISH_EFFECTS"

      - name: Assert that publish replies on the canary PR's review thread
        run: |
          jq -e 'any(.[]; .type == "ReplyToReviewComment" and .number == (env.CANARY_PR | tonumber))' <<<"$PUBLISH_EFFECTS"

      - name: Assert that finish clears afk:in-progress
        run: |
          jq -e 'any(.[]; . == {"type": "EditLabels", "number": (env.CANARY_PR | tonumber), "add": [], "remove": ["afk:in-progress"]})' <<<"$FINISH_EFFECTS"

      - name: Assert that finish plans no failure comment
        run: |
          jq -e 'all(.[]; .type != "Comment" or (.body | startswith("The AFK run on this PR failed") | not))' <<<"$FINISH_EFFECTS"

  # The canary PR's branch sits on an older commit of main without conflicting with it, so its update merges cleanly and runs no agent.
  afk-update-branch-workflow:
    # Tests run on pull requests only; claude-code-action refuses a push event.
    if: github.event_name == 'pull_request'
    # The production jobs' permissions.
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read

    uses: $/.github/workflows/afk-update-branch.yml
    with:
      number: ${{ fromJSON(vars.AFK_CANARY_PR) }}
      dry-run: true
      model: claude-haiku-5-5
      effort: low
    secrets:
      AFK_APP_PRIVATE_KEY: ${{ secrets.AFK_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  afk-update-branch-workflow-assertions:
    needs: afk-update-branch-workflow
    # Also after a failed run, whose finish effects then hold its failure comment.
    if: github.event_name == 'pull_request' && !cancelled()
    permissions: {}

    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        shell: bash

    env:
      CANARY_PR: ${{ vars.AFK_CANARY_PR }}
      PUBLISH_EFFECTS: ${{ needs.afk-update-branch-workflow.outputs.publish-effects }}
      FINISH_EFFECTS: ${{ needs.afk-update-branch-workflow.outputs.finish-effects }}

    steps:
      - name: Assert that publish pushes the merge with a lease on the canary PR's head
        run: |
          jq -e 'any(.[]; .type == "PushBranch" and (.lease | length) == 40)' <<<"$PUBLISH_EFFECTS"

      - name: Assert that publish comments the merge on the canary PR
        run: |
          jq -e 'any(.[]; .type == "Comment" and .number == (env.CANARY_PR | tonumber) and (.body | startswith("Merged `main`") or startswith("> *Conflicts with `main`")))' <<<"$PUBLISH_EFFECTS"

      - name: Assert that finish clears afk:in-progress
        run: |
          jq -e 'any(.[]; . == {"type": "EditLabels", "number": (env.CANARY_PR | tonumber), "add": [], "remove": ["afk:in-progress"]})' <<<"$FINISH_EFFECTS"

      - name: Assert that finish plans no failure comment
        run: |
          jq -e 'all(.[]; .type != "Comment" or (.body | startswith("The AFK run that updates this PR") | not))' <<<"$FINISH_EFFECTS"

  # Dispatches with GITHUB_TOKEN, as the AFK dispatcher does, each run workflow whose canary starts the agent, so that GitHub starts the run as github-actions.
  afk-dispatched-run-workflow:
    name: afk-dispatched-run-workflow (${{ matrix.workflow }})
    # Tests run on pull requests only.
    if: github.event_name == 'pull_request'

    permissions:
      actions: write

    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - workflow: afk-run.yml
            number: ${{ vars.AFK_CANARY_TICKET }}
          - workflow: afk-run-pr.yml
            number: ${{ vars.AFK_CANARY_PR }}

    steps:
      - name: Dispatch the workflow as a dry run, and wait for it to succeed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ matrix.workflow }}
          NUMBER: ${{ matrix.number }}
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          url=$(gh workflow run "$WORKFLOW" --ref "$REF" -f number="$NUMBER" -f dry-run=true -f model=claude-haiku-5-5 -f effort=low \
            | grep -o 'https://[^ ]*/actions/runs/[0-9]*')
          echo "Dispatched $url"
          if ! gh run watch "${url##*/}" --exit-status --interval 30 >/dev/null; then
            gh run view "${url##*/}"
            exit 1
          fi

  actions-lock:
    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify lockfile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/lock_github_actions.sh --verify
