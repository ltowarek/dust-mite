<script>
  const DATA = {"prs": {"212": {"title": "Shut the streamer down cleanly on SIGTERM and SIGINT", "stats": "+187 \u221224 \u00b7 10 files", "labels": [], "context": "A controller change with no DUT run. Variants B\u2013E pretend an AFK run wrote it."}, "183": {"title": "Stream Camera frames closer to the camera's rate", "stats": "+30 \u22128 \u00b7 4 files", "labels": ["needs-car"], "context": "A car firmware change that needs the car to confirm. The real PR came from an interactive session at the desk; variants B\u2013E pretend an AFK run wrote it and a car agent session then did the DUT run."}}, "variants": [{"id": "a-actual", "key": "A", "name": "As merged", "note": "The body the real PR carried, for comparison."}, {"id": "b-pr-skill", "key": "B", "name": "Vanilla /pr", "note": "Matt's released template filled as written: Summary, Evidence, Merge Danger. Nothing added."}, {"id": "c-pr-plus", "key": "C", "name": "/pr + review aids", "note": "Adds Read first, Worth understanding, a DUT run section, the repo's one-way doors and Undo."}, {"id": "d-calls-first", "key": "D", "name": "Calls first", "note": "Opens with what the agent decided that the ticket didn't, then what isn't tested; shape and evidence fold away."}, {"id": "e-four-lines", "key": "E", "name": "Four lines", "note": "Changed, verified, could break, safe to merge. Everything else folds away."}, {"id": "f-agreed", "key": "F", "name": "Agreed so far", "note": "Vanilla /pr plus the agreed parts: Check these against the ticket, a Worth understanding section of folded items, DUT run, and the YAML's Closes line and run link."}], "bodies": {"212": {"a-actual": "<p dir=\"auto\">Closes <a class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\" data-id=\"6029871390\" data-permission-text=\"Title is private\" data-url=\"https://github.com/ltowarek/dust-mite/issues/197\" data-hovercard-type=\"issue\" data-hovercard-url=\"/ltowarek/dust-mite/issues/197/hovercard\" href=\"https://github.com/ltowarek/dust-mite/issues/197\">#197<\/a>. Part of <a class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\" data-id=\"3510955533\" data-permission-text=\"Title is private\" data-url=\"https://github.com/ltowarek/dust-mite/issues/5\" data-hovercard-type=\"issue\" data-hovercard-url=\"/ltowarek/dust-mite/issues/5/hovercard\" href=\"https://github.com/ltowarek/dust-mite/issues/5\">#5<\/a>.<\/p>\n<p dir=\"auto\"><code class=\"notranslate\">docker stop<\/code> (SIGTERM) and Ctrl-C (SIGINT) now stop the streamer through the same path the tests use to leave the entry point, instead of killing it mid-flight.<\/p>\n<h2 dir=\"auto\">Commits<\/h2>\n<ol dir=\"auto\">\n<li><strong>Export the profiler's open window when the process exits.<\/strong> <code class=\"notranslate\">Sampler.stop()<\/code> waits for sampling and any export in flight to end, then exports the window still open; before, those samples were dropped. <code class=\"notranslate\">otlp_profiler.configure()<\/code> registers <code class=\"notranslate\">stop()<\/code> with <code class=\"notranslate\">atexit<\/code>, as the OpenTelemetry SDK providers register their shutdown.<\/li>\n<li><strong>Shut the streamer down cleanly on SIGTERM and SIGINT.<\/strong>\n<ul dir=\"auto\">\n<li><code class=\"notranslate\">main<\/code>'s event loop handles both signals by setting a stop event, which leaves <code class=\"notranslate\">serve_streamer<\/code>. A repeated signal while stopping does nothing; once the loop has closed, the default handlers are back.<\/li>\n<li>The WebSocket server closes its clients with 1001 Going Away and the connections to the car close. Both already followed from leaving the entry point; they are now tested.<\/li>\n<li>Viewer responses end with the chunked terminator instead of being cut off. As <code class=\"notranslate\">aiohttp<\/code>'s graceful-shutdown docs do for long-lived connections, the Camera server keeps each open Viewer's Outbox in the app (an <code class=\"notranslate\">AppKey<\/code> holding a <code class=\"notranslate\">WeakSet<\/code>) and closes them in <code class=\"notranslate\">on_shutdown<\/code>, so each handler returns. A Viewer still starting up when shutdown begins is cancelled after 0.1 s, as in <code class=\"notranslate\">aiohttp<\/code>'s own example.<\/li>\n<li><code class=\"notranslate\">run_streamer.sh<\/code> execs the streamer, so <code class=\"notranslate\">docker stop<\/code>'s SIGTERM reaches it rather than the shell running as PID 1.<\/li>\n<li>The Copper variant doc and the profiling guide describe the shutdown and the final profile export.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Name close codes in tests with websockets' <code class=\"notranslate\">CloseCode<\/code>.<\/strong> CONTRIBUTING.md's ground rules now say that a test's expected values come from outside the code under test: a literal, or a named constant from a library or a standard. The 1013 and 1001 checks through the Streamer endpoints use <code class=\"notranslate\">CloseCode<\/code> members.<\/li>\n<\/ol>\n<p dir=\"auto\">The decision on repeated signals is written into <a class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\" data-id=\"6029871390\" data-permission-text=\"Title is private\" data-url=\"https://github.com/ltowarek/dust-mite/issues/197\" data-hovercard-type=\"issue\" data-hovercard-url=\"/ltowarek/dust-mite/issues/197/hovercard\" href=\"https://github.com/ltowarek/dust-mite/issues/197\">#197<\/a> and the <a class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\" data-id=\"3510955533\" data-permission-text=\"Title is private\" data-url=\"https://github.com/ltowarek/dust-mite/issues/5\" data-hovercard-type=\"issue\" data-hovercard-url=\"/ltowarek/dust-mite/issues/5/hovercard\" href=\"https://github.com/ltowarek/dust-mite/issues/5\">#5<\/a> spec.<\/p>\n<h2 dir=\"auto\">Tests<\/h2>\n<ul dir=\"auto\">\n<li>Integration, through the entry point with real car doubles:\n<ul dir=\"auto\">\n<li>Stopping closes <code class=\"notranslate\">/drive<\/code> and <code class=\"notranslate\">/telemetry<\/code> clients with 1001.<\/li>\n<li>Stopping ends a Viewer's response; it fails with <code class=\"notranslate\">IncompleteRead<\/code> on <code class=\"notranslate\">main<\/code>.<\/li>\n<li>Stopping closes the connections to the car's Camera, Telemetry and Drive endpoints.<\/li>\n<\/ul>\n<\/li>\n<li>Unit:\n<ul dir=\"auto\">\n<li>Closing an Outbox ends its iteration after the messages it holds.<\/li>\n<li><code class=\"notranslate\">Sampler.stop()<\/code> exports the window still open.<\/li>\n<\/ul>\n<\/li>\n<li>The signal wiring stays a thin layer and has no automated test. It was checked by hand by running the <code class=\"notranslate\">streamer<\/code> process against the car doubles and a recording OTLP server. For both SIGTERM and SIGINT, the client got 1001, the process exited with 0 in about 0.17 s, and logs, metrics and traces were posted after the signal. A profile was posted only when the last window held on-CPU samples, because empty exports are skipped.<\/li>\n<\/ul>\n<p dir=\"auto\">\ud83e\udd16 Generated with <a href=\"https://claude.com/claude-code\" rel=\"nofollow\">Claude Code<\/a><\/p>", "b-pr-skill": "<h2 dir=\"auto\">Summary<\/h2>\n<p dir=\"auto\"><code class=\"notranslate\">docker stop<\/code> (SIGTERM) and Ctrl-C (SIGINT) now leave the streamer the way the tests already do: by ending its entry point.<\/p>\n<div class=\"highlight highlight-source-diff\" dir=\"auto\"><pre class=\"notranslate\"> main\n<span class=\"pl-md\"><span class=\"pl-md\">-<\/span>  asyncio.run(_serve_until_cancelled)        # SIGINT raised KeyboardInterrupt; SIGTERM killed it<\/span>\n<span class=\"pl-mi1\"><span class=\"pl-mi1\">+<\/span>  asyncio.run(_serve_until_signalled)<\/span>\n<span class=\"pl-mi1\"><span class=\"pl-mi1\">+<\/span>    add_signal_handler(SIGTERM, SIGINT \u2192 stop.set)<\/span>\n     serve_streamer\n       /drive, /telemetry                      # leaving closes clients with 1001 Going Away\n       /camera\n<span class=\"pl-mi1\"><span class=\"pl-mi1\">+<\/span>        on_shutdown: Outbox.close() per Viewer<\/span>\n<span class=\"pl-md\"><span class=\"pl-md\">-<\/span>    await Event().wait()<\/span>\n<span class=\"pl-mi1\"><span class=\"pl-mi1\">+<\/span>    await stop.wait()<\/span>\n<span class=\"pl-mi1\"><span class=\"pl-mi1\">+<\/span>  atexit: Sampler.stop()                      # exports the profile window still open<\/span><\/pre><\/div>\n<h2 dir=\"auto\">Evidence<\/h2>\n<ul dir=\"auto\">\n<li>\n<p dir=\"auto\"><strong>Before:<\/strong> on <code class=\"notranslate\">main<\/code>, a Viewer reading when the streamer stops fails with <code class=\"notranslate\">IncompleteRead<\/code>, and the profile window still open is dropped.<br>\n<strong>After:<\/strong><\/p>\n<pre lang=\"text\" class=\"notranslate\"><code class=\"notranslate\">test_stopping_ends_viewer_responses                      PASSED   (fails on main)\ntest_stopping_closes_websocket_clients_with_going_away   PASSED   [drive, telemetry]\ntest_stopping_closes_the_connections_to_the_car          PASSED   [camera, telemetry, drive]\ntest_stop_exports_the_window_still_open                  PASSED\n<\/code><\/pre>\n<\/li>\n<li>\n<p dir=\"auto\"><strong>Before:<\/strong> no automated test covers the signal wiring.<br>\n<strong>After:<\/strong> by hand, against the car doubles and a recording OTLP server, for both SIGTERM and SIGINT: the client got 1001, the process exited 0 in about 0.17 s, and logs, metrics and traces were posted after the signal.<\/p>\n<\/li>\n<\/ul>\n<h2 dir=\"auto\">Merge Danger<\/h2>\n<p dir=\"auto\"><strong>Door:<\/strong> two-way<\/p>\n<p dir=\"auto\">Reverting restores the old behaviour; nothing persists.<\/p>\n<p dir=\"auto\"><strong>Blast Radius:<\/strong> streamer<\/p>\n<p dir=\"auto\">A stop that hangs now waits for <code class=\"notranslate\">docker stop<\/code>'s SIGKILL after 10 s instead of dying at once. <code class=\"notranslate\">run_streamer.sh<\/code> now <code class=\"notranslate\">exec<\/code>s, so the streamer is PID 1 in its container.<\/p>", "c-pr-plus": "<p dir=\"auto\">Closes <a class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\" data-id=\"6029871390\" data-permission-text=\"Title is private\" data-url=\"https://github.com/ltowarek/dust-mite/issues/197\" data-hovercard-type=\"issue\" data-hovercard-url=\"/ltowarek/dust-mite/issues/197/hovercard\" href=\"https://github.com/ltowarek/dust-mite/issues/197\">#197<\/a>.<\/p>\n<h2 dir=\"auto\">Summary<\/h2>\n<p dir=\"auto\"><code class=\"notranslate\">docker stop<\/code> (SIGTERM) and Ctrl-C (SIGINT) now leave the streamer the way the tests already do: by ending its entry point.<\/p>\n<div class=\"highlight highlight-source-diff\" dir=\"auto\"><pre class=\"notranslate\"> main\n<span class=\"pl-md\"><span class=\"pl-md\">-<\/span>  asyncio.run(_serve_until_cancelled)        # SIGINT raised KeyboardInterrupt; SIGTERM killed it<\/span>\n<span class=\"pl-mi1\"><span class=\"pl-mi1\">+<\/span>  asyncio.run(_serve_until_signalled)<\/span>\n<span class=\"pl-mi1\"><span class=\"pl-mi1\">+<\/span>    add_signal_handler(SIGTERM, SIGINT \u2192 stop.set)<\/span>\n     serve_streamer\n       /drive, /telemetry                      # leaving closes clients with 1001 Going Away\n       /camera\n<span class=\"pl-mi1\"><span class=\"pl-mi1\">+<\/span>        on_shutdown: Outbox.close() per Viewer<\/span>\n<span class=\"pl-md\"><span class=\"pl-md\">-<\/span>    await Event().wait()<\/span>\n<span class=\"pl-mi1\"><span class=\"pl-mi1\">+<\/span>    await stop.wait()<\/span>\n<span class=\"pl-mi1\"><span class=\"pl-mi1\">+<\/span>  atexit: Sampler.stop()                      # exports the profile window still open<\/span><\/pre><\/div>\n<h2 dir=\"auto\">Read first<\/h2>\n<ol dir=\"auto\">\n<li><a href=\"https://github.com/ltowarek/dust-mite/blob/db5ff8436f945e06734a12751079fb93657c2edc/controller/src/controller/streamer.py#L307-L328\"><code class=\"notranslate\">streamer.py<\/code> L307\u2013328<\/a>: the signal handlers and the Viewer shutdown, the whole change in behaviour.<\/li>\n<li><a href=\"https://github.com/ltowarek/dust-mite/blob/db5ff8436f945e06734a12751079fb93657c2edc/controller/tests/integration/test_streamer.py#L622-L671\"><code class=\"notranslate\">test_streamer.py<\/code> L622\u2013671<\/a>: the three new tests say what \"cleanly\" means.<\/li>\n<li><a href=\"https://github.com/ltowarek/dust-mite/blob/db5ff8436f945e06734a12751079fb93657c2edc/controller/src/otlp_profiler/sampler.py#L76-L84\"><code class=\"notranslate\">sampler.py<\/code> L76\u201384<\/a>: <code class=\"notranslate\">stop()<\/code> exports once more.<\/li>\n<\/ol>\n<p dir=\"auto\">Skim the rest: <code class=\"notranslate\">outbox.py<\/code> only extracts <code class=\"notranslate\">close()<\/code>; the docs add one line each.<\/p>\n<h2 dir=\"auto\">Worth understanding<\/h2>\n<p dir=\"auto\"><strong>Why one word in <code class=\"notranslate\">run_streamer.sh<\/code> decides whether SIGTERM arrives.<\/strong> <code class=\"notranslate\">docker stop<\/code> signals PID 1 of the container. Without <code class=\"notranslate\">exec<\/code>, PID 1 is the shell running the script, and the shell doesn't pass SIGTERM on to its child, so Docker sends SIGKILL after 10 s. <code class=\"notranslate\">exec<\/code> replaces the shell with the streamer, which then is PID 1 and gets the signal itself.<\/p>\n<p dir=\"auto\"><strong>Why <code class=\"notranslate\">loop.add_signal_handler<\/code>, not <code class=\"notranslate\">signal.signal<\/code>.<\/strong> asyncio runs the handler as a normal callback inside the event loop, so <code class=\"notranslate\">stop.set()<\/code> is safe there. A <code class=\"notranslate\">signal.signal<\/code> handler interrupts whatever Python code is running, which may be halfway through the event loop's own bookkeeping.<\/p>\n<h2 dir=\"auto\">Evidence<\/h2>\n<ul dir=\"auto\">\n<li>\n<p dir=\"auto\"><strong>Before:<\/strong> on <code class=\"notranslate\">main<\/code>, a Viewer reading when the streamer stops fails with <code class=\"notranslate\">IncompleteRead<\/code>, and the profile window still open is dropped.<br>\n<strong>After:<\/strong><\/p>\n<pre lang=\"text\" class=\"notranslate\"><code class=\"notranslate\">test_stopping_ends_viewer_responses                      PASSED   (fails on main)\ntest_stopping_closes_websocket_clients_with_going_away   PASSED   [drive, telemetry]\ntest_stopping_closes_the_connections_to_the_car          PASSED   [camera, telemetry, drive]\ntest_stop_exports_the_window_still_open                  PASSED\n<\/code><\/pre>\n<\/li>\n<li>\n<p dir=\"auto\"><strong>Before:<\/strong> no automated test covers the signal wiring.<br>\n<strong>After:<\/strong> by hand, against the car doubles and a recording OTLP server, for both SIGTERM and SIGINT: the client got 1001, the process exited 0 in about 0.17 s, and logs, metrics and traces were posted after the signal.<\/p>\n<\/li>\n<li>\n<p dir=\"auto\"><strong>DUT run:<\/strong> not needed. The car doubles cover every connection the change closes, and the car firmware is unchanged.<\/p>\n<\/li>\n<\/ul>\n<h2 dir=\"auto\">Merge Danger<\/h2>\n<p dir=\"auto\"><strong>Door:<\/strong> two-way<\/p>\n<p dir=\"auto\">Touches none of the repo's one-way doors: partition table, NVS layout, WebSocket message schema, CI workflows.<\/p>\n<p dir=\"auto\"><strong>Undo:<\/strong> revert the PR; nothing persists.<\/p>\n<p dir=\"auto\"><strong>Blast Radius:<\/strong> streamer<\/p>\n<p dir=\"auto\">A stop that hangs now waits for <code class=\"notranslate\">docker stop<\/code>'s SIGKILL after 10 s instead of dying at once.<\/p>", "d-calls-first": "<p dir=\"auto\">Closes <a class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\" data-id=\"6029871390\" data-permission-text=\"Title is private\" data-url=\"https://github.com/ltowarek/dust-mite/issues/197\" data-hovercard-type=\"issue\" data-hovercard-url=\"/ltowarek/dust-mite/issues/197/hovercard\" href=\"https://github.com/ltowarek/dust-mite/issues/197\">#197<\/a> \u00b7 two-way door \u00b7 blast radius: streamer \u00b7 DUT run: not needed<\/p>\n<h2 dir=\"auto\">Check these against the ticket<\/h2>\n<p dir=\"auto\">Everything else follows <a class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\" data-id=\"6029871390\" data-permission-text=\"Title is private\" data-url=\"https://github.com/ltowarek/dust-mite/issues/197\" data-hovercard-type=\"issue\" data-hovercard-url=\"/ltowarek/dust-mite/issues/197/hovercard\" href=\"https://github.com/ltowarek/dust-mite/issues/197\">#197<\/a> as written.<\/p>\n<ol dir=\"auto\">\n<li><strong>A Viewer still starting up when shutdown begins is cancelled after 0.1 s<\/strong>, as in <code class=\"notranslate\">aiohttp<\/code>'s own graceful-shutdown example. <a class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\" data-id=\"6029871390\" data-permission-text=\"Title is private\" data-url=\"https://github.com/ltowarek/dust-mite/issues/197\" data-hovercard-type=\"issue\" data-hovercard-url=\"/ltowarek/dust-mite/issues/197/hovercard\" href=\"https://github.com/ltowarek/dust-mite/issues/197\">#197<\/a> says Viewer responses end, not what happens to one mid-handshake. <a href=\"https://github.com/ltowarek/dust-mite/blob/db5ff8436f945e06734a12751079fb93657c2edc/controller/src/controller/streamer.py#L294\"><code class=\"notranslate\">streamer.py<\/code> L294<\/a><\/li>\n<li><strong>The profiler's stop doesn't wait for an export already in flight.<\/strong> Both may run; the aggregator's lock gives each sample to one of them. Waiting instead would hold the exit for up to one export's timeout. <a href=\"https://github.com/ltowarek/dust-mite/blob/db5ff8436f945e06734a12751079fb93657c2edc/controller/src/otlp_profiler/sampler.py#L76-L84\"><code class=\"notranslate\">sampler.py<\/code> L76\u201384<\/a><\/li>\n<li><strong>A new ground rule in <code class=\"notranslate\">CONTRIBUTING.md<\/code>:<\/strong> a test's expected values come from outside the code under test. <a class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\" data-id=\"6029871390\" data-permission-text=\"Title is private\" data-url=\"https://github.com/ltowarek/dust-mite/issues/197\" data-hovercard-type=\"issue\" data-hovercard-url=\"/ltowarek/dust-mite/issues/197/hovercard\" href=\"https://github.com/ltowarek/dust-mite/issues/197\">#197<\/a> doesn't ask for it; the close-code checks needed it. <a href=\"https://github.com/ltowarek/dust-mite/blob/db5ff8436f945e06734a12751079fb93657c2edc/CONTRIBUTING.md#L12\"><code class=\"notranslate\">CONTRIBUTING.md<\/code> L12<\/a><\/li>\n<\/ol>\n<h2 dir=\"auto\">What isn't tested automatically<\/h2>\n<ul dir=\"auto\">\n<li><strong>The signal wiring,<\/strong> as <a class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\" data-id=\"6029871390\" data-permission-text=\"Title is private\" data-url=\"https://github.com/ltowarek/dust-mite/issues/197\" data-hovercard-type=\"issue\" data-hovercard-url=\"/ltowarek/dust-mite/issues/197/hovercard\" href=\"https://github.com/ltowarek/dust-mite/issues/197\">#197<\/a> allows. Checked by hand against the car doubles and a recording OTLP server: for SIGTERM and SIGINT the client got 1001 and the process exited 0 in about 0.17 s.<\/li>\n<li><strong>7 lines of <code class=\"notranslate\">streamer.py<\/code><\/strong> per Codecov, all in <code class=\"notranslate\">_serve_until_signalled<\/code>.<\/li>\n<\/ul>\n<h2 dir=\"auto\">Reading route<\/h2>\n<ol dir=\"auto\">\n<li><a href=\"https://github.com/ltowarek/dust-mite/blob/db5ff8436f945e06734a12751079fb93657c2edc/controller/src/controller/streamer.py#L307-L328\"><code class=\"notranslate\">streamer.py<\/code> L307\u2013328<\/a>: signal handlers and Viewer shutdown.<\/li>\n<li><a href=\"https://github.com/ltowarek/dust-mite/blob/db5ff8436f945e06734a12751079fb93657c2edc/controller/tests/integration/test_streamer.py#L622-L671\"><code class=\"notranslate\">test_streamer.py<\/code> L622\u2013671<\/a>: what \"cleanly\" means.<\/li>\n<li><a href=\"https://github.com/ltowarek/dust-mite/blob/db5ff8436f945e06734a12751079fb93657c2edc/controller/src/otlp_profiler/sampler.py#L76-L84\"><code class=\"notranslate\">sampler.py<\/code> L76\u201384<\/a>: the last profile export.<\/li>\n<\/ol>\n<details>\n<summary>Shape of the change<\/summary>\n<div class=\"highlight highlight-source-diff\" dir=\"auto\"><pre class=\"notranslate\"> main\n<span class=\"pl-md\"><span class=\"pl-md\">-<\/span>  asyncio.run(_serve_until_cancelled)        # SIGINT raised KeyboardInterrupt; SIGTERM killed it<\/span>\n<span class=\"pl-mi1\"><span class=\"pl-mi1\">+<\/span>  asyncio.run(_serve_until_signalled)<\/span>\n<span class=\"pl-mi1\"><span class=\"pl-mi1\">+<\/span>    add_signal_handler(SIGTERM, SIGINT \u2192 stop.set)<\/span>\n     serve_streamer\n       /drive, /telemetry                      # leaving closes clients with 1001 Going Away\n       /camera\n<span class=\"pl-mi1\"><span class=\"pl-mi1\">+<\/span>        on_shutdown: Outbox.close() per Viewer<\/span>\n<span class=\"pl-md\"><span class=\"pl-md\">-<\/span>    await Event().wait()<\/span>\n<span class=\"pl-mi1\"><span class=\"pl-mi1\">+<\/span>    await stop.wait()<\/span>\n<span class=\"pl-mi1\"><span class=\"pl-mi1\">+<\/span>  atexit: Sampler.stop()                      # exports the profile window still open<\/span><\/pre><\/div>\n<\/details>\n<details>\n<summary>Evidence: before and after<\/summary>\n<p dir=\"auto\">On <code class=\"notranslate\">main<\/code>, a Viewer reading when the streamer stops fails with <code class=\"notranslate\">IncompleteRead<\/code>, and the profile window still open is dropped. On this branch:<\/p>\n<pre lang=\"text\" class=\"notranslate\"><code class=\"notranslate\">test_stopping_ends_viewer_responses                      PASSED   (fails on main)\ntest_stopping_closes_websocket_clients_with_going_away   PASSED   [drive, telemetry]\ntest_stopping_closes_the_connections_to_the_car          PASSED   [camera, telemetry, drive]\ntest_stop_exports_the_window_still_open                  PASSED\n<\/code><\/pre>\n<\/details>", "e-four-lines": "<p dir=\"auto\"><strong>Changed:<\/strong> SIGTERM and SIGINT stop the streamer by ending its entry point: WebSocket clients get 1001, Viewer responses end, the connections to the car close, and the profiler exports its last window. Closes <a class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\" data-id=\"6029871390\" data-permission-text=\"Title is private\" data-url=\"https://github.com/ltowarek/dust-mite/issues/197\" data-hovercard-type=\"issue\" data-hovercard-url=\"/ltowarek/dust-mite/issues/197/hovercard\" href=\"https://github.com/ltowarek/dust-mite/issues/197\">#197<\/a>.<br>\n<strong>Verified:<\/strong> 7 new tests (10 cases) through the entry point and in units; the Viewer one fails on <code class=\"notranslate\">main<\/code>. The signal wiring by hand: exit 0 in about 0.17 s.<br>\n<strong>Could break:<\/strong> a stop that hangs now waits 10 s for <code class=\"notranslate\">docker stop<\/code>'s SIGKILL.<br>\n<strong>Safe to merge:<\/strong> yes. Two-way door: a revert restores the old behaviour, nothing persists.<\/p>\n<details>\n<summary>Shape of the change<\/summary>\n<div class=\"highlight highlight-source-diff\" dir=\"auto\"><pre class=\"notranslate\"> main\n<span class=\"pl-md\"><span class=\"pl-md\">-<\/span>  asyncio.run(_serve_until_cancelled)        # SIGINT raised KeyboardInterrupt; SIGTERM killed it<\/span>\n<span class=\"pl-mi1\"><span class=\"pl-mi1\">+<\/span>  asyncio.run(_serve_until_signalled)<\/span>\n<span class=\"pl-mi1\"><span class=\"pl-mi1\">+<\/span>    add_signal_handler(SIGTERM, SIGINT \u2192 stop.set)<\/span>\n     serve_streamer\n       /drive, /telemetry                      # leaving closes clients with 1001 Going Away\n       /camera\n<span class=\"pl-mi1\"><span class=\"pl-mi1\">+<\/span>        on_shutdown: Outbox.close() per Viewer<\/span>\n<span class=\"pl-md\"><span class=\"pl-md\">-<\/span>    await Event().wait()<\/span>\n<span class=\"pl-mi1\"><span class=\"pl-mi1\">+<\/span>    await stop.wait()<\/span>\n<span class=\"pl-mi1\"><span class=\"pl-mi1\">+<\/span>  atexit: Sampler.stop()                      # exports the profile window still open<\/span><\/pre><\/div>\n<\/details>\n<details>\n<summary>Worth understanding: why one word in <code class=\"notranslate\">run_streamer.sh<\/code> decides whether SIGTERM arrives<\/summary>\n<p dir=\"auto\"><code class=\"notranslate\">docker stop<\/code> signals PID 1 of the container. Without <code class=\"notranslate\">exec<\/code>, PID 1 is the shell running the script, and the shell doesn't pass SIGTERM on to its child, so Docker sends SIGKILL after 10 s. <code class=\"notranslate\">exec<\/code> replaces the shell with the streamer, which then is PID 1 and gets the signal itself.<\/p>\n<\/details>", "f-agreed": "<p dir=\"auto\">Closes <a class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\" data-id=\"6029871390\" data-permission-text=\"Title is private\" data-url=\"https://github.com/ltowarek/dust-mite/issues/197\" data-hovercard-type=\"issue\" data-hovercard-url=\"/ltowarek/dust-mite/issues/197/hovercard\" href=\"https://github.com/ltowarek/dust-mite/issues/197\">#197<\/a>.<\/p>\n<h2 dir=\"auto\">Check these against the ticket<\/h2>\n<p dir=\"auto\">Everything else follows <a class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\" data-id=\"6029871390\" data-permission-text=\"Title is private\" data-url=\"https://github.com/ltowarek/dust-mite/issues/197\" data-hovercard-type=\"issue\" data-hovercard-url=\"/ltowarek/dust-mite/issues/197/hovercard\" href=\"https://github.com/ltowarek/dust-mite/issues/197\">#197<\/a> as written.<\/p>\n<ol dir=\"auto\">\n<li><strong>A Viewer still starting up when shutdown begins is cancelled after 0.1 s<\/strong>, as in <code class=\"notranslate\">aiohttp<\/code>'s own graceful-shutdown example. <a class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\" data-id=\"6029871390\" data-permission-text=\"Title is private\" data-url=\"https://github.com/ltowarek/dust-mite/issues/197\" data-hovercard-type=\"issue\" data-hovercard-url=\"/ltowarek/dust-mite/issues/197/hovercard\" href=\"https://github.com/ltowarek/dust-mite/issues/197\">#197<\/a> says Viewer responses end, not what happens to one mid-handshake. <a href=\"https://github.com/ltowarek/dust-mite/blob/db5ff8436f945e06734a12751079fb93657c2edc/controller/src/controller/streamer.py#L294\"><code class=\"notranslate\">streamer.py<\/code> L294<\/a><\/li>\n<li><strong>The profiler's stop doesn't wait for an export already in flight.<\/strong> Both may run; the aggregator's lock gives each sample to one of them. Waiting instead would hold the exit for up to one export's timeout. <a href=\"https://github.com/ltowarek/dust-mite/blob/db5ff8436f945e06734a12751079fb93657c2edc/controller/src/otlp_profiler/sampler.py#L76-L84\"><code class=\"notranslate\">sampler.py<\/code> L76\u201384<\/a><\/li>\n<li><strong>A new ground rule in <code class=\"notranslate\">CONTRIBUTING.md<\/code>:<\/strong> a test's expected values come from outside the code under test. <a class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\" data-id=\"6029871390\" data-permission-text=\"Title is private\" data-url=\"https://github.com/ltowarek/dust-mite/issues/197\" data-hovercard-type=\"issue\" data-hovercard-url=\"/ltowarek/dust-mite/issues/197/hovercard\" href=\"https://github.com/ltowarek/dust-mite/issues/197\">#197<\/a> doesn't ask for it; the close-code checks needed it. <a href=\"https://github.com/ltowarek/dust-mite/blob/db5ff8436f945e06734a12751079fb93657c2edc/CONTRIBUTING.md#L12\"><code class=\"notranslate\">CONTRIBUTING.md<\/code> L12<\/a><\/li>\n<\/ol>\n<h2 dir=\"auto\">Summary< o\">asyncio runs the handler as a normal callback inside the event loop, so <code class=\"notranslate\">stop.set()<\/code> is safe there. A <code class=\"notranslate\">signal.signal<\/code> handler interrupts whatever Python code is running, which may be halfway through the event loop's own bookkeeping.<\/p>\n<\/details>\n<h2 dir=\"auto\">Evidence<\/h2>\n<ul dir=\"auto\">\n<li>\n<p dir=\"auto\"><strong>Before:<\/strong> on <code class=\"notranslate\">main<\/code>, a Viewer reading when the streamer stops fails with <code class=\"notranslate\">IncompleteRead<\/code>, and the profile window still open is dropped.<br>\n<strong>After:<\/strong><\/p>\n<pre lang=\"text\" class=\"notranslate\"><code class=\"notranslate\">test_stopping_ends_viewer_responses                      PASSED   (fails on main)\ntest_stopping_closes_websocket_clients_with_going_away   PASSED   [drive, telemetry]\ntest_stopping_closes_the_connections_to_the_car          PASSED   [camera, telemetry, drive]\ntest_stop_exports_the_window_still_open                  PASSED\n<\/code><\/pre>\n<\/li>\n<li>\n<p dir=\"auto\"><strong>Before:<\/strong> no automated test covers the signal wiring.<br>\n<strong>After:<\/strong> by hand, <code class=\"notranslate\">streamer<\/code> against the car doubles and a recording OTLP server, for both SIGTERM and SIGINT: the client got 1001, the process exited 0 in about 0.17 s, and logs, metrics and traces were posted after the signal.<\/p>\n<\/li>\n<\/ul>\n<h2 dir=\"auto\">Merge Danger<\/h2>\n<p dir=\"auto\"><strong>Door:<\/strong> two-way<\/p>\n<p dir=\"auto\"><strong>Blast Radius:<\/strong> streamer<\/p>\n<p dir=\"auto\">A stop that hangs now waits for <code class=\"notranslate\">docker stop<\/code>'s SIGKILL after 10 s instead of dying at once.<\/p>\n<hr>\n<p dir=\"auto\">\ud83e\udd16 Written by an <a href=\"https://github.com/ltowarek/dust-mite/actions\">AFK run<\/a> (example link).<\/p>"}, "183": {"a-actual": "<h2 dir=\"auto\">Stream Camera frames closer to the camera's rate<\/h2>\n<p dir=\"auto\">Closes <a class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\" data-id=\"6001703041\" data-permission-text=\"Title is private\" data-url=\"https://github.com/ltowarek/dust-mite/issues/182\" data-hovercard-type=\"issue\" data-hovercard-url=\"/ltowarek/dust-mite/issues/182/hovercard\" href=\"https://github.com/ltowarek/dust-mite/issues/182\">#182<\/a>. On <code class=\"notranslate\">main<\/code>, base64 and cJSON encoding of each Camera frame keep the car well below the camera's 25 frames per second (<a class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\" data-id=\"4814425376\" data-permission-text=\"Title is private\" data-url=\"https://github.com/ltowarek/dust-mite/issues/104\" data-hovercard-type=\"issue\" data-hovercard-url=\"/ltowarek/dust-mite/issues/104/hovercard\" href=\"https://github.com/ltowarek/dust-mite/issues/104\">#104<\/a>). This PR removes two further losses that also apply to the MJPEG stream:<\/p>\n<ul dir=\"auto\">\n<li><strong>TCP send buffer.<\/strong> lwIP's default send buffer, 5760 bytes or four segments, made each Camera frame's message, up to about 26 KB of base64 JSON, wait three or four rounds of ACKs. The stream task waits for each send before it takes the next frame. The send buffer is now 32 KB, so a message is queued whole. Wi-Fi and lwIP allocate from PSRAM first, so the queued segments stay out of internal RAM. That makes the Wi-Fi TX buffers static and raises the defaults of the static RX buffers and the RX block-ack window. Eight TX buffers and the old RX values keep idle internal RAM where it was.<\/li>\n<li><strong>Task stats.<\/strong> On dual-core ESP-IDF, <code class=\"notranslate\">uxTaskGetSystemState()<\/code> holds the kernel lock, with interrupts masked, while it scans every task's stack. The camera misses DMA interrupts during the scan and drops the frame. The new <code class=\"notranslate\">CONFIG_SYSTEM_METRICS_TASK_STATS_REFRESH_MS<\/code> (default 10000) sets how often the stats are read again; collections in between report the last read. Task stats remain off by default and on only in <code class=\"notranslate\">sdkconfig.defaults.all<\/code>.<\/li>\n<\/ul>\n<h2 dir=\"auto\">Results<\/h2>\n<p dir=\"auto\">Car with <code class=\"notranslate\">sdkconfig.defaults<\/code> + <code class=\"notranslate\">.all<\/code> + <code class=\"notranslate\">.profiling<\/code>. A WebSocket client reads the Camera endpoint for 60 s after a 30 s settle. Internal free heap comes from <code class=\"notranslate\">dust_mite_internal_free_heap_bytes<\/code>.<\/p>\n<markdown-accessiblity-table><table role=\"table\">\n<thead>\n<tr>\n<th><\/th>\n<th><code class=\"notranslate\">main<\/code> (2 runs)<\/th>\n<th>This PR (2 runs)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Camera frames per second<\/td>\n<td>14.4 / 12.5<\/td>\n<td>17.4 / 17.4<\/td>\n<\/tr>\n<tr>\n<td>Gap between frames, p50<\/td>\n<td>64 / 85 ms<\/td>\n<td>51 / 52 ms<\/td>\n<\/tr>\n<tr>\n<td>Gap between frames, p95<\/td>\n<td>123 / 136 ms<\/td>\n<td>119 / 120 ms<\/td>\n<\/tr>\n<tr>\n<td>Internal free heap, idle<\/td>\n<td>121.4 / 121.8 KB<\/td>\n<td>123.3 / 123.3 KB<\/td>\n<\/tr>\n<tr>\n<td>Internal free heap, minimum while streaming<\/td>\n<td>104.9 / 97.1 KB<\/td>\n<td>117.5 / 119.4 KB<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/markdown-accessiblity-table>\n<p dir=\"auto\"><a class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\" data-id=\"4814425376\" data-permission-text=\"Title is private\" data-url=\"https://github.com/ltowarek/dust-mite/issues/104\" data-hovercard-type=\"issue\" data-hovercard-url=\"/ltowarek/dust-mite/issues/104/hovercard\" href=\"https://github.com/ltowarek/dust-mite/issues/104\">#104<\/a> removes the encoding by moving to MJPEG over HTTP (ADR 0002). On that branch, the same two changes take the stream from 19.5\u201320.0 to 24.0 frames per second and the send p95 from 41\u201344 ms to 19\u201320 ms.<\/p>\n<p dir=\"auto\">The issue's acceptance tests (<code class=\"notranslate\">test_viewer_receives_camera_rate<\/code>, <code class=\"notranslate\">test_car_sends_frames_promptly<\/code>) and the Unity benchmark <code class=\"notranslate\">stream_keeps_the_camera_rate<\/code> depend on the MJPEG stream. They stay on <code class=\"notranslate\">mjpeg-camera-frames<\/code> and land with <a class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\" data-id=\"4814425376\" data-permission-text=\"Title is private\" data-url=\"https://github.com/ltowarek/dust-mite/issues/104\" data-hovercard-type=\"issue\" data-hovercard-url=\"/ltowarek/dust-mite/issues/104/hovercard\" href=\"https://github.com/ltowarek/dust-mite/issues/104\">#104<\/a>.<\/p>\n<h2 dir=\"auto\">Test plan<\/h2>\n<ul class=\"contains-task-list\">\n<li class=\"task-list-item\"><input type=\"checkbox\" id=\"\" disabled=\"\" class=\"task-list-item-checkbox\" aria-label=\"Completed task\" checked=\"\"> Car firmware builds with <code class=\"notranslate\">sdkconfig.defaults<\/code> + <code class=\"notranslate\">.all<\/code> + <code class=\"notranslate\">.profiling<\/code><\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" id=\"\" disabled=\"\" class=\"task-list-item-checkbox\" aria-label=\"Completed task\" checked=\"\"> Frame rate and internal heap measured on the car, <code class=\"notranslate\">main<\/code> against this PR (table above)<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" id=\"\" disabled=\"\" class=\"task-list-item-checkbox\" aria-label=\"Incomplete task\"> CI<\/li>\n<\/ul>\n<p dir=\"auto\">\ud83e\udd16 Generated with <a href=\"https://claude.com/claude-code\" rel=\"nofollow\">Claude Code<\/a><\/p>", "b-pr-skill": "<h2 dir=\"auto\">Summary<\/h2>\n<p dir=\"auto\">Every send of a Camera frame that takes longer than one frame period (40 ms at 25 per second) costs the next Camera frame. Two things made sends that long.<\/p>\n<div class=\"highlight highlight-source-diff\" dir=\"auto\"><pre class=\"notranslate\"> stream task, per Camera frame\n   take Camera frame\n<span class=\"pl-md\"><span class=\"pl-md\">-<\/span>  send it                     # waits 3\u20134 rounds of ACKs: 5760 B TCP send buffer, frames up to 26 KB<\/span>\n<span class=\"pl-mi1\"><span class=\"pl-mi1\">+<\/span>  send it                     # queued whole: 32 KB TCP send buffer, segments in PSRAM<\/span>\n system metrics, per collection\n<span class=\"pl-md\"><span class=\"pl-md\">-<\/span>  uxTaskGetSystemState()      # every 100 ms; masks interrupts, so the camera misses DMA<\/span>\n<span class=\"pl-mi1\"><span class=\"pl-mi1\">+<\/span>  uxTaskGetSystemState()      # every CONFIG_SYSTEM_METRICS_TASK_STATS_REFRESH_MS, default 10 s<\/span><\/pre><\/div>\n<h2 dir=\"auto\">Evidence<\/h2>\n<ul dir=\"auto\">\n<li><strong>Before:<\/strong> <code class=\"notranslate\">main<\/code>, two runs: 14.4 / 12.5 Camera frames per second; internal free heap at least 104.9 / 97.1 KB while streaming.<br>\n<strong>After:<\/strong> 17.4 / 17.4 Camera frames per second; internal free heap at least 117.5 / 119.4 KB.<\/li>\n<\/ul>\n<h2 dir=\"auto\">Merge Danger<\/h2>\n<p dir=\"auto\"><strong>Door:<\/strong> two-way<\/p>\n<p dir=\"auto\"><strong>Blast Radius:<\/strong> internal RAM<\/p>\n<p dir=\"auto\">The Wi-Fi TX buffers become static. Eight of them and the old RX values keep idle internal RAM where it was in the measured build; builds without <code class=\"notranslate\">.all<\/code> and <code class=\"notranslate\">.profiling<\/code> weren't measured.<\/p>", "c-pr-plus": "<p dir=\"auto\">Closes <a class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\" data-id=\"6001703041\" data-permission-text=\"Title is private\" data-url=\"https://github.com/ltowarek/dust-mite/issues/182\" data-hovercard-type=\"issue\" data-hovercard-url=\"/ltowarek/dust-mite/issues/182/hovercard\" href=\"https://github.com/ltowarek/dust-mite/issues/182\">#182<\/a>.<\/p>\n<h2 dir=\"auto\">Summary<\/h2>\n<p dir=\"auto\">Every send of a Camera frame that takes longer than one frame period (40 ms at 25 per second) costs the next Camera frame. Two things made sends that long.<\/p>\n<div class=\"highlight highlight-source-diff\" dir=\"auto\"><pre class=\"notranslate\"> stream task, per Camera frame\n   take Camera frame\n<span class=\"pl-md\"><span class=\"pl-md\">-<\/span>  send it                     # waits 3\u20134 rounds of ACKs: 5760 B TCP send buffer, frames up to 26 KB<\/span>\n<span class=\"pl-mi1\"><span class=\"pl-mi1\">+<\/span>  send it                     # queued whole: 32 KB TCP send buffer, segments in PSRAM<\/span>\n system metrics, per collection\n<span class=\"pl-md\"><span class=\"pl-md\">-<\/span>  uxTaskGetSystemState()      # every 100 ms; masks interrupts, so the camera misses DMA<\/span>\n<span class=\"pl-mi1\"><span class=\"pl-mi1\">+<\/span>  uxTaskGetSystemState()      # every CONFIG_SYSTEM_METRICS_TASK_STATS_REFRESH_MS, default 10 s<\/span><\/pre><\/div>\n<h2 dir=\"auto\">Read first<\/h2>\n<ol dir=\"auto\">\n<li><a href=\"https://github.com/ltowarek/dust-mite/blob/010a21ff04b24a3be5673f4b1b49c4b6db0a035a/car/sdkconfig.defaults#L20-L29\"><code class=\"notranslate\">sdkconfig.defaults<\/code> L20\u201329<\/a>: five settings, the whole fix for the send.<\/li>\n<li><a href=\"https://github.com/ltowarek/dust-mite/blob/010a21ff04b24a3be5673f4b1b49c4b6db0a035a/car/components/tracing/system_metrics.cpp#L54-L58\"><code class=\"notranslate\">system_metrics.cpp<\/code> L54\u201358<\/a>: the refresh gate.<\/li>\n<\/ol>\n<p dir=\"auto\">Skim the rest: Kconfig help text and one row of the metrics table.<\/p>\n<h2 dir=\"auto\">Worth understanding<\/h2>\n<p dir=\"auto\"><strong>Why a bigger TCP send buffer raises the frame rate, not only throughput.<\/strong> The send call returns only once lwIP has accepted every byte. With 5760 bytes of buffer, a 20 KB Camera frame waits for three or four rounds of ACKs over Wi-Fi. Meanwhile the stream task can't take the next Camera frame, and with two frame buffers the camera has nowhere to put one, so it drops it. With 32 KB the whole Camera frame is copied in and the call returns; the ACKs arrive while the camera fills the next buffer.<\/p>\n<p dir=\"auto\"><strong>Why reading task stats drops Camera frames.<\/strong> On the dual-core ESP32-S3, <code class=\"notranslate\">uxTaskGetSystemState()<\/code> holds the kernel lock with interrupts masked while it walks every task's stack. The camera's DMA interrupt waits for it, and the frame being captured is lost.<\/p>\n<h2 dir=\"auto\">Evidence<\/h2>\n<ul dir=\"auto\">\n<li><strong>Before:<\/strong> <code class=\"notranslate\">main<\/code>, two runs: 14.4 / 12.5 Camera frames per second; internal free heap at least 104.9 / 97.1 KB while streaming.<br>\n<strong>After:<\/strong> 17.4 / 17.4 Camera frames per second; internal free heap at least 117.5 / 119.4 KB.<\/li>\n<li><strong>CI:<\/strong> firmware builds with <code class=\"notranslate\">sdkconfig.defaults<\/code>, <code class=\"notranslate\">.all<\/code> and <code class=\"notranslate\">.profiling<\/code>; QEMU tests pass. No QEMU test sees Wi-Fi throughput.<\/li>\n<\/ul>\n<h2 dir=\"auto\">DUT run<\/h2>\n<p dir=\"auto\"><code class=\"notranslate\">needs-car<\/code>: a QEMU run can't show Wi-Fi sends or DMA interrupts.<\/p>\n<p dir=\"auto\">Steps, from <a class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\" data-id=\"6001703041\" data-permission-text=\"Title is private\" data-url=\"https://github.com/ltowarek/dust-mite/issues/182\" data-hovercard-type=\"issue\" data-hovercard-url=\"/ltowarek/dust-mite/issues/182/hovercard\" href=\"https://github.com/ltowarek/dust-mite/issues/182\">#182<\/a>'s \"How to measure\":<\/p>\n<ul class=\"contains-task-list\">\n<li class=\"task-list-item\"><input type=\"checkbox\" id=\"\" disabled=\"\" class=\"task-list-item-checkbox\" aria-label=\"Completed task\" checked=\"\"> Build <code class=\"notranslate\">car/<\/code> with <code class=\"notranslate\">SDKCONFIG_DEFAULTS=\"sdkconfig.defaults;sdkconfig.defaults.all;sdkconfig.defaults.profiling\"<\/code> and flash it.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" id=\"\" disabled=\"\" class=\"task-list-item-checkbox\" aria-label=\"Completed task\" checked=\"\"> Run <code class=\"notranslate\">observability/tests/e2e/test_camera_stream.py --dut<\/code> twice on <code class=\"notranslate\">main<\/code> and twice on this branch.<\/li>\n<\/ul>\n<p dir=\"auto\">Criteria, from <a class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\" data-id=\"6001703041\" data-permission-text=\"Title is private\" data-url=\"https://github.com/ltowarek/dust-mite/issues/182\" data-hovercard-type=\"issue\" data-hovercard-url=\"/ltowarek/dust-mite/issues/182/hovercard\" href=\"https://github.com/ltowarek/dust-mite/issues/182\">#182<\/a>'s \"Done when\":<\/p>\n<ul class=\"contains-task-list\">\n<li class=\"task-list-item\"><input type=\"checkbox\" id=\"\" disabled=\"\" class=\"task-list-item-checkbox\" aria-label=\"Incomplete task\"> <code class=\"notranslate\">test_viewer_receives_camera_rate<\/code>, at least 22 per second: <strong>not met<\/strong>, 17.4. Base64 and cJSON encoding still cap the rate until <a class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\" data-id=\"4814425376\" data-permission-text=\"Title is private\" data-url=\"https://github.com/ltowarek/dust-mite/issues/104\" data-hovercard-type=\"issue\" data-hovercard-url=\"/ltowarek/dust-mite/issues/104/hovercard\" href=\"https://github.com/ltowarek/dust-mite/issues/104\">#104<\/a>.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" id=\"\" disabled=\"\" class=\"task-list-item-checkbox\" aria-label=\"Incomplete task\"> <code class=\"notranslate\">test_car_sends_frames_promptly<\/code>, send p95 at most 45 ms: <strong>not measured<\/strong>. The test needs the MJPEG stream from <a class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\" data-id=\"4814425376\" data-permission-text=\"Title is private\" data-url=\"https://github.com/ltowarek/dust-mite/issues/104\" data-hovercard-type=\"issue\" data-hovercard-url=\"/ltowarek/dust-mite/issues/104/hovercard\" href=\"https://github.com/ltowarek/dust-mite/issues/104\">#104<\/a>.<\/li>\n<li class=\"task-list-item\"><input type=\"checkbox\" id=\"\" disabled=\"\" class=\"task-list-item-checkbox\" aria-label=\"Completed task\" checked=\"\"> Internal free heap does not fall: met, see the table.<\/li>\n<\/ul>\n<p dir=\"auto\"><em>Results from the car agent session, 2026-10-24:<\/em><\/p>\n<markdown-accessiblity-table><table role=\"table\">\n<thead>\n<tr>\n<th><\/th>\n<th><code class=\"notranslate\">main<\/code> (2 runs)<\/th>\n<th>This PR (2 runs)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Camera frames per second<\/td>\n<td>14.4 / 12.5<\/td>\n<td>17.4 / 17.4<\/td>\n<\/tr>\n<tr>\n<td>Gap between Camera frames, p95<\/td>\n<td>123 / 136 ms<\/td>\n<td>119 / 120 ms<\/td>\n<\/tr>\n<tr>\n<td>Internal free heap, idle<\/td>\n<td>121.4 / 121.8 KB<\/td>\n<td>123.3 / 123.3 KB<\/td>\n<\/tr>\n<tr>\n<td>Internal free heap, minimum while streaming<\/td>\n<td>104.9 / 97.1 KB<\/td>\n<td>117.5 / 119.4 KB<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/markdown-accessiblity-table>\n<h2 dir=\"auto\">Merge Danger<\/h2>\n<p dir=\"auto\"><strong>Door:<\/strong> two-way<\/p>\n<p dir=\"auto\">Touches none of the repo's one-way doors: partition table, NVS layout, WebSocket message schema, CI workflows.<\/p>\n<p dir=\"auto\"><strong>Undo:<\/strong> revert and flash again; nothing on the car outlives a flash.<\/p>\n<p dir=\"auto\"><strong>Blast Radius:<\/strong> internal RAM<\/p>\n<p dir=\"auto\">The Wi-Fi TX buffers become static. Eight of them and the old RX values keep idle internal RAM where it was in the measured build; builds without <code class=\"notranslate\">.all<\/code> and <code class=\"notranslate\">.profiling<\/code> weren't measured.<\/p>", "d-calls-first": "<p dir     const c = counts(body);
    document.getElementById("counts").innerHTML = `<span>Words shown <b>${c.shown}</b></span><span>Total <b>${c.total}</b></span>`;
    document.querySelectorAll("#prs button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.pr === state.pr));
    document.querySelectorAll("#variants button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === state.variant));
    const hash = `#pr-${state.pr}-${v.key.toLowerCase()}`;
    if (location.hash !== hash) history.replaceState(null, "", hash);
  }

  const prsEl = document.getElementById("prs");
  prIds.forEach((id) => {
    const b = document.createElement("button");
    b.type = "button"; b.dataset.pr = id; b.id = "pr-" + id;
    b.textContent = `#${id} ${DATA.prs[id].title}`;
    b.onclick = () => { state.pr = id; render(); };
    prsEl.append(b);
  });
  const varsEl = document.getElementById("variants");
  DATA.variants.forEach((v) => {
    const b = document.createElement("button");
    b.type = "button"; b.dataset.v = v.id; b.id = "variant-" + v.key;
    b.innerHTML = `<kbd>${v.key}</kbd>${v.name}`;
    b.onclick = () => { state.variant = v.id; render(); };
    varsEl.append(b);
  });
  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input, textarea")) return;
    const i = DATA.variants.findIndex((x) => x.id === state.variant);
    if (e.key === "ArrowRight") state.variant = DATA.variants[(i + 1) % DATA.variants.length].id;
    else if (e.key === "ArrowLeft") state.variant = DATA.variants[(i - 1 + DATA.variants.length) % DATA.variants.length].id;
    else {
      const v = DATA.variants.find((x) => x.key.toLowerCase() === e.key.toLowerCase());
      if (!v) return;
      state.variant = v.id;
    }
    render();
  });
  window.addEventListener("hashchange", () => { readHash(); render(); });
  readHash();
  render();
</script>
