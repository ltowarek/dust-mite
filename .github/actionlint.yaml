paths:
  .github/workflows/{ci,cpp-car,js-web,python-controller}.yml:
    ignore:
      # actionlint does not support the $/ self-repository syntax yet: https://github.com/rhysd/actionlint/issues/711
      - '^reusable workflow call "\$/\.github/workflows/[^"]+\.yml" at "uses" is not following the format '
  .github/workflows/{afk-dispatch,afk-run,afk-run-pr,afk-update-branch}.yml:
    ignore:
      # actionlint does not support the concurrency queue key yet: https://github.com/rhysd/actionlint/issues/657
      - '^unexpected key "queue" for "concurrency" section\. '
  .github/workflows/infrastructure.yml:
    ignore:
      # actionlint does not support the $/ self-repository syntax yet: https://github.com/rhysd/actionlint/issues/711
      - '^reusable workflow call "\$/\.github/workflows/[^"]+\.yml" at "uses" is not following the format '
      # actionlint does not support the $/ self-repository syntax for actions yet: https://github.com/rhysd/actionlint/issues/711
      - '^specifying action "\$/\.github/actions/afk-promote-queued" in invalid format because ref is missing\. '
  .github/workflows/afk-promote-queued.yml:
    ignore:
      # actionlint does not support the concurrency queue key yet: https://github.com/rhysd/actionlint/issues/657
      - '^unexpected key "queue" for "concurrency" section\. '
      # actionlint does not support the $/ self-repository syntax yet: https://github.com/rhysd/actionlint/issues/711
      - '^specifying action "\$/\.github/actions/afk-promote-queued" in invalid format because ref is missing\. '
