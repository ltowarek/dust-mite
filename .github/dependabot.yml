version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /.devcontainer/cpp
      - /car
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      espressif-idf:
        patterns:
          - espressif/idf
        group-by: dependency-name
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
