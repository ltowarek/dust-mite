receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "*"

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  otlp_http/mimir:
    endpoint: http://mimir:8080/otlp
    tls:
      insecure: true

  otlp_http/pyroscope:
    endpoint: http://pyroscope:4040
    compression: none
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp_grpc/tempo]

    metrics:
      receivers: [otlp]
      exporters: [otlp_http/mimir]

    profiles:
      receivers: [otlp]
      exporters: [otlp_http/pyroscope]
