receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          # Explicit origins, not "*": this receiver also sends Access-Control-Allow-Credentials,
          # and a wildcard Access-Control-Allow-Origin alongside that is invalid per the Fetch
          # spec, so browsers reject it outright. The two origins are the browser dev server on
          # the host and inside the headless stack.
          allowed_origins:
            - "http://localhost:5173"
            - "http://js:5173"

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  otlp_http/pyroscope:
    endpoint: http://pyroscope:4040
    compression: none
    tls:
      insecure: true

  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp_grpc/tempo]

    profiles:
      receivers: [otlp]
      exporters: [otlp_http/pyroscope]

    logs:
      receivers: [otlp]
      exporters: [otlp_http/loki]
