multitenancy_enabled: false

# A lone ingester/store-gateway/alertmanager never reports itself healthy in
# the ring at the default replication_factor of 3 (it can't find enough
# replicas). Single instance needs replication_factor: 1 everywhere a ring
# is used.
ingester:
  ring:
    replication_factor: 1
    kvstore:
      store: inmemory

store_gateway:
  sharding_ring:
    replication_factor: 1

alertmanager:
  data_dir: /var/mimir/alertmanager-data
  sharding_ring:
    replication_factor: 1

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /var/mimir/blocks
  tsdb:
    dir: /var/mimir/tsdb
  bucket_store:
    sync_dir: /var/mimir/tsdb-sync

compactor:
  data_dir: /var/mimir/compactor

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /var/mimir/rules

alertmanager_storage:
  backend: filesystem
  filesystem:
    dir: /var/mimir/alertmanager
