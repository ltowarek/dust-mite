networks:
  dust-mite-observability:
    name: dust-mite-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.146.0
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
      - "--feature-gates=service.profilesSupport"
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./otelcol.yml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - tempo
      - pyroscope
    networks:
      - dust-mite-observability

  pyroscope:
    image: grafana/pyroscope:1.18.1
    command:
      - "-config.file=/etc/pyroscope/config.yml"
      - "-self-profiling.disable-push=true"
    volumes:
      - ./pyroscope.yml:/etc/pyroscope/config.yml:ro
    ports:
      - "4040:4040"   # HTTP API + OTLP profiles ingestion
    networks:
      - dust-mite-observability

  profiling-symbolizer:
    build:
      context: ../car/components/esp-opentelemetry-cpp/tools/symbolizer
    ports:
      - "4319:4319"   # OTLP/HTTP JSON profiles in (device -> symbolizer)
    environment:
      SYMBOLIZER_LISTEN_ADDR: "0.0.0.0:4319"
      SYMBOLIZER_FORWARD_URL: "http://otel-collector:4318/v1development/profiles"
    volumes:
      - ../car:/firmware:ro
    depends_on:
      - otel-collector
    networks:
      - dust-mite-observability

  tempo:
    image: grafana/tempo:3.0.0
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./tempo.yml:/etc/tempo.yml:ro
    networks:
      - dust-mite-observability

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.110.0
    ports:
      - "8428:8428"   # HTTP API (Prometheus-compatible + OTLP ingestion)
    networks:
      - dust-mite-observability

  grafana:
    image: grafana/grafana:13.0.1-security-01
    ports:
      - "3000:3000"   # Grafana UI
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - tempo
      - victoriametrics
    networks:
      - dust-mite-observability
