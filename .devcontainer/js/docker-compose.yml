networks:
  dust-mite-observability:
    name: dust-mite-observability

services:
  js:
    build:
      context: ../..
      dockerfile: .devcontainer/js/Dockerfile
      args:
        USER_UID: "${USER_UID:-1050}"
        USER_GID: "${USER_GID:-1050}"
    volumes:
      - ../..:/workspaces/dust-mite:cached
    environment:
      - VITE_CAMERA_URL
      - VITE_OTLP_ENDPOINT
      - VITE_WS_URL
    ports:
      - "5174:5173"
    command: sleep infinity
    networks:
      - dust-mite-observability
      - default
