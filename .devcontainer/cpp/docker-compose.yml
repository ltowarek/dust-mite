networks:
  dust-mite-observability:
    name: dust-mite-observability

services:
  cpp:
    build:
      context: ../..
      dockerfile: .devcontainer/cpp/Dockerfile
      args:
        USER_UID: "${USER_UID:-1050}"
        USER_GID: "${USER_GID:-1050}"
    volumes:
      - ../..:/workspaces/dust-mite:cached
    environment:
      - CAR_OTLP_LOGS_BASE_URL
      - CAR_OTLP_METRICS_BASE_URL
      - CAR_OTLP_PROFILES_BASE_URL
      - CAR_OTLP_TRACES_BASE_URL
      - CAR_SERIAL_PORT
      - WIFI_PASSWORD
      - WIFI_SSID
    command: sleep infinity
    networks:
      - dust-mite-observability
