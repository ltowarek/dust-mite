networks:
  dust-mite-observability:
    name: dust-mite-observability

services:
  observability:
    build:
      context: ../..
      dockerfile: .devcontainer/observability/Dockerfile
      args:
        USER_UID: "${UID:-1050}"
        USER_GID: "${GID:-1050}"
    user: "${UID:-1050}:${GID:-1050}"
    volumes:
      - ../..:/workspaces/dust-mite:cached
    env_file:
      - path: ../../.env
    command: sleep infinity
    networks:
      - dust-mite-observability
      - default
