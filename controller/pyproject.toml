[build-system]
requires = ["setuptools", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "controller"
dynamic = ["version"]
requires-python = ">=3.12"

[project.scripts]
controller = "controller.controller:main"
streamer = "controller.streamer:main"

[tool.setuptools_scm]
root = ".."

[tool.setuptools.packages.find]
where = ["src"]

[tool.tox]
legacy_tox_ini = """
    [tox]
    env_list =
        py312

    [testenv]
    package = editable
    deps = -r requirements/dev.txt
    passenv =
        DRIVE_CLIENT_URI
        STREAM_CLIENT_URI
        TELEMETRY_CLIENT_URI
    commands = pytest --cov=src --cov-report=xml:coverage.xml --junitxml=results.xml -o junit_family=legacy {posargs:tests/}
"""

[tool.mypy]
python_version = "3.12"
files = [
    "src/**/*.py",
    "tests/**/*.py"
]
strict = true

# pydualsense and picamera2 ship without type information.
[[tool.mypy.overrides]]
module = ["pydualsense", "pydualsense.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "picamera2"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
include = [
    "pyproject.toml",
    "src/**/*.py",
    "tests/**/*.py"
]

[tool.ruff.lint]
select = ["ALL"]
# COM812 conflicts with `ruff format`; ruff warns when both are enabled.
ignore = ["COM812"]
unfixable = ["F401"]

# Tests are named for what they check rather than given docstrings, and
# pytest's own assertion rewriting relies on bare asserts.
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101"]
# pytest imports conftest.py by path, so it never needs an __init__.py.
"conftest.py" = ["INP001"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
