networks:
  dust-mite-observability:
    name: dust-mite-observability

services:
  cpp:
    build:
      context: ./car
    environment:
      - CAR_SERIAL_PORT
      - WIFI_PASSWORD
      - WIFI_SSID
    command: sleep infinity
    networks:
      - dust-mite-observability

  python:
    build:
      context: ./controller
      dockerfile: Dockerfile
      additional_contexts:
        root: .
    environment:
      - CONTROLLER_INPUT_BACKEND
      - DRIVE_CLIENT_URI
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
      - OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
      - SERVICE_REPOSITORY
      - STREAMER_CAMERA_PORT
      - STREAMER_DRIVE_URI
      - STREAM_CLIENT_URI
      - TELEMETRY_CLIENT_URI
    # devices:
    #   - /dev/hidraw4:/dev/hidraw4
    ports:
      - "8765:8765"
      - "8766:8766"
    command: sleep infinity
    networks:
      - dust-mite-observability
      - default

  js:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      - VITE_CAMERA_URL
      - VITE_OTLP_ENDPOINT
      - VITE_WS_URL
    ports:
      - "5173:5173"
    command: sleep infinity
    networks:
      - dust-mite-observability
      - default

  otel-collector:
    extends:
      file: observability/docker-compose.yml
      service: otel-collector

  tempo:
    extends:
      file: observability/docker-compose.yml
      service: tempo

  mimir:
    extends:
      file: observability/docker-compose.yml
      service: mimir

  loki:
    extends:
      file: observability/docker-compose.yml
      service: loki

  grafana:
    extends:
      file: observability/docker-compose.yml
      service: grafana

  pyroscope:
    extends:
      file: observability/docker-compose.yml
      service: pyroscope

  profiling-symbolizer:
    extends:
      file: observability/docker-compose.yml
      service: profiling-symbolizer

  test-runner:
    build:
      context: .
      dockerfile: .devcontainer/js/Dockerfile
      args:
        USER_UID: "${USER_UID:-1050}"
        USER_GID: "${USER_GID:-1050}"
    volumes:
      - .:/workspaces/dust-mite
    working_dir: /workspaces/dust-mite/web
    environment:
      BASE_URL: http://js:5173
      VITE_WS_URL: ws://python:8765
      VITE_CAMERA_URL: http://python:8766/camera
      PLAYWRIGHT_OUTPUT_DIR: /tmp/playwright-results
    command: sleep infinity
    networks:
      - dust-mite-observability
